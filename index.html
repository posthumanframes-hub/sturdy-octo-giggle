<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot Twist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column; each scene = eyebrow bar, serif headline, a tactile stage, quiet paper buttons. Chapter One lives on butter, Chapter Two on dusty pink, the in-between on sage. */
:root{
  --butter-bg:#F7EDCB; --cream-bg:#FBF6EC; --sage-bg:#E2E8D9; --pink-bg:#F1DDD6; --blue-bg:#DEE8EF;
  --ink:#3D3431; --ink-soft:#73665F; --line:rgba(61,52,49,.18);
  --paper:#FFFCF5; --paper-ink:#3D3431; --paper-soft:#7A6D66;
  --coral:#C65A43; --coral-ink:#FFF8F0;
  --n-butter:#F3E2A6; --n-pink:#EDC3BC; --n-blue:#CFDDE8; --n-sage:#C3D3B8; --n-cream:#FFFCF5;
  --table:#FBF4E2; --table-edge:rgba(61,52,49,.14);
  --shadow:rgba(61,52,49,.16);
  --serif:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --stamp-ok:#4F6B45; --stamp-flag:#B4462F;
  --bg:var(--butter-bg);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B;
  --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2);
  --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4);
  --coral:#D86A50; --stamp-ok:#A7C59A; --stamp-flag:#EE937C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B;
  --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2);
  --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4);
  --coral:#D86A50; --stamp-ok:#A7C59A; --stamp-flag:#EE937C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .6s ease;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
body[data-tone=butter]{--bg:var(--butter-bg)}
body[data-tone=cream]{--bg:var(--cream-bg)}
body[data-tone=sage]{--bg:var(--sage-bg)}
body[data-tone=pink]{--bg:var(--pink-bg)}
body[data-tone=blue]{--bg:var(--blue-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:3px;border-radius:6px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.bar{display:flex;align-items:center;gap:10px;min-height:46px}
.eyebrow{flex:1;font:800 9.5px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.icon-btn{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px var(--shadow)}
.icon-btn.back{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.scene{flex:1;display:flex;flex-direction:column;gap:14px;animation:sceneIn .55s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.t{font:400 clamp(28px,8.4vw,35px)/1.08 var(--serif);letter-spacing:-.015em;margin:12px 0 0;text-wrap:balance;outline:none}
.sub{color:var(--ink-soft);margin:-4px 0 0;font-size:13.5px;line-height:1.45;max-width:36ch}
.label{font:800 9.5px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.label.w{color:var(--coral)}
.hint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:0;line-height:1.5}
.actions{display:grid;gap:8px;margin-top:auto;padding-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 13.5px/1.2 var(--sans);border-radius:8px;padding:13px 14px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--spring),box-shadow .2s;box-shadow:0 1px 2px var(--shadow);text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--coral);color:var(--coral-ink);border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.btn.link{background:none;border:0;box-shadow:none;color:var(--ink-soft);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);padding-top:16px}
.foot svg{width:11px;height:11px}
.ill{display:block;width:100%;height:100%;overflow:visible;filter:url(#wobble)}

/* paper notes */
.note-w{filter:drop-shadow(0 3px 5px var(--shadow));transition:transform .35s var(--spring)}
.note{--n:var(--n-butter);position:relative;background:var(--n);color:var(--paper-ink);font:400 18px/1.18 var(--serif);padding:16px 26px 18px 16px;border:1.3px solid var(--paper-ink);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.note::after{content:"";position:absolute;top:-1px;right:-1px;width:21px;height:21px;background:linear-gradient(225deg,transparent 48%,var(--paper-ink) 48% 54%,rgba(0,0,0,.08) 54%)}
.note small{display:block;font:700 9.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:8px}
.note.pink{--n:var(--n-pink)} .note.blue{--n:var(--n-blue)} .note.sage{--n:var(--n-sage)} .note.cream{--n:var(--n-cream)}
.tape{position:absolute;width:46px;height:14px;background:rgba(243,226,166,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);transform:rotate(-4deg)}

/* hero illustrations */
.hero{position:relative;height:250px;margin:4px 0;pointer-events:none}
.hero .env,.chapter .env{touch-action:auto}
.page .empty{color:var(--paper-soft)}
.mini-known .label{color:var(--paper-soft)}
.nb .cover{backface-visibility:hidden}
.hero > *{position:absolute}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(var(--r,0deg))}}
.squiggle{width:136px;height:14px;color:var(--coral);margin-top:-2px;overflow:visible}
.squiggle path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s ease-out .2s forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
html.rm .squiggle path{stroke-dashoffset:0}
.display{font:400 clamp(54px,17vw,72px)/.92 var(--serif);letter-spacing:-.03em;margin:22px 0 0;outline:none}
.lede{font-size:15px;margin:0}
.card-btn{display:block;text-align:left;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;font-size:11px;line-height:1.5;box-shadow:0 1px 2px var(--shadow)}
.card-btn b{font-size:11.5px;display:block}
.card-btn span{color:var(--paper-soft)}

/* chapter select */
.chapter{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;color:var(--ink)}
.chapter.flip{grid-template-columns:110px 1fr}
.chapter h2{font:400 22px/1.15 var(--serif);margin:0 0 6px}
.chapter p{margin:0;font-size:13px;color:var(--ink-soft)}
.chapter .pic{height:110px;transition:transform .4s var(--spring)}
.chapter:hover .pic,.chapter:focus-visible .pic{transform:rotate(-3deg) translateY(-3px)}
.dash{border:0;border-top:1.5px dashed var(--line);margin:4px 0;width:100%}

/* envelope */
.env{position:relative;width:min(100%,320px);aspect-ratio:3/2;margin:14px auto 0;perspective:900px;touch-action:none}
.env > *{position:absolute;left:0;width:100%}
.env-body{top:0;height:100%;z-index:1}
.env-paper{left:7%;width:86%;top:8%;height:84%;z-index:2;background:var(--paper);border:1.3px solid var(--paper-ink);border-radius:2px;transition:transform .8s var(--spring);padding:12px 14px;color:var(--paper-ink);font:400 13px/1.3 var(--serif)}
.env-paper i{display:block;height:5px;margin:7px 0;background:rgba(61,52,49,.12);border-radius:3px}
.env-front{top:0;height:100%;z-index:3;pointer-events:none}
.env-flap{top:0;height:62%;z-index:4;transform-origin:50% 0;transition:transform .7s var(--spring);transform-style:preserve-3d;cursor:grab}
.env-flap.dragging{transition:none}
.env.open .env-flap{transform:rotateX(178deg);z-index:0}
.env.open .env-paper{transform:translateY(-58%)}
.pull{position:absolute;right:10%;top:-4%;background:var(--n-butter);border:1.3px solid var(--paper-ink);color:var(--paper-ink);font:600 11px var(--serif);padding:4px 9px;transform:rotate(-8deg);z-index:5;pointer-events:none}
.env-label{position:absolute;left:30%;top:56%;z-index:3;background:var(--paper);border:1.3px solid var(--paper-ink);color:var(--paper-ink);padding:6px 10px;font:600 11px/1.25 var(--sans);transform:rotate(-2deg);pointer-events:none}
.env-arc{position:absolute;right:-2%;top:-22%;width:60px;height:70px;color:var(--coral);z-index:6;pointer-events:none}

/* biodata paper */
.fold{position:relative;width:min(100%,330px);margin:6px auto 0;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);box-shadow:0 8px 18px -8px var(--shadow);transform:rotate(-1.2deg);touch-action:pan-y;cursor:pointer}
.panel{padding:12px 18px;overflow:hidden;transform-origin:50% 0;transition:max-height .65s var(--spring),transform .65s var(--spring),opacity .4s,padding .4s;max-height:420px}
.panel + .panel{border-top:1.2px dashed rgba(61,52,49,.3)}
.panel.shut{max-height:0;opacity:.2;transform:perspective(600px) rotateX(-85deg);padding-block:0}
.bd-om{text-align:center;font:600 10px/1.2 var(--sans);letter-spacing:.14em;color:var(--coral);margin:2px 0 4px}
.bd-title{text-align:center;font:600 20px/1.1 var(--serif);letter-spacing:.18em;margin:0 0 8px}
.bd-row{display:grid;grid-template-columns:42% 1fr;gap:8px;font-size:11.5px;line-height:1.35;padding:2.5px 0;border-bottom:1px dotted rgba(61,52,49,.18)}
.bd-row b{font-weight:700;color:var(--paper-soft)}
.bd-row.hide span{font-style:italic;color:var(--paper-soft)}
.bd-empty{font:400 26px/1.15 var(--serif);padding:22px 4px 26px}
.fold .tape{left:42%;top:-8px}

/* tabletop */
.tabletop{position:relative;width:100%;background:var(--table);border:1px solid var(--table-edge);border-radius:6px;box-shadow:inset 0 0 40px rgba(120,90,40,.06),0 10px 24px -14px var(--shadow);overflow:hidden}
.obj{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;transition:left .7s var(--spring),top .7s var(--spring),transform .35s var(--spring),opacity .4s,filter .2s;filter:drop-shadow(0 3px 2px var(--shadow));z-index:2}
.obj.lifted{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.14);filter:drop-shadow(0 12px 10px var(--shadow));z-index:20;transition:transform .3s var(--spring),filter .2s;cursor:grabbing}
.obj.packed{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.obj.seen::after{content:"";position:absolute;right:4px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--coral);opacity:.55}
.pocket{position:absolute;width:78px;height:72px;background:none;border:0;padding:0;cursor:pointer;z-index:3;transition:transform .35s var(--spring)}
.pocket.hot{transform:scale(1.12) rotate(-3deg)}
.pocket .cnt{position:absolute;left:0;right:0;top:44%;text-align:center;font:700 10px var(--sans);color:#2f3a2c}
.space{position:absolute;transform:translate(-50%,-50%);border:1.6px dashed var(--ink-soft);border-radius:40% 55% 45% 50%;width:72px;height:64px;display:grid;place-items:center;color:var(--ink-soft);background:none;cursor:pointer;font:400 22px var(--serif);animation:fadeIn 1s ease both;z-index:1}
@keyframes fadeIn{from{opacity:0}}
.source{position:absolute;left:8%;top:10%;width:46%;transform:rotate(-3deg);background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);padding:12px;font:400 15px/1.2 var(--serif);cursor:pointer}
.source small{display:block;font:800 8.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;color:var(--paper-soft)}

/* inspect */
.inspect{display:grid;grid-template-columns:1fr;gap:10px}
.big:focus-visible{outline-offset:8px}
.wrow .note-w{transition:transform .35s var(--spring),opacity .2s}
.big{width:150px;height:150px;margin:2px auto 0;transform:rotate(var(--r,0deg));transition:transform .5s var(--spring);touch-action:none;cursor:grab;filter:drop-shadow(0 10px 8px var(--shadow))}
.big.dragging{transition:none}
.rot{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.rot .icon-btn{width:34px;height:34px}
.known{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.known ul{margin:6px 0 0;padding-left:16px}
.known .label{color:var(--paper-soft)}
.wrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:end}
.wrow .note-w{touch-action:none;cursor:grab;transform:rotate(-2deg)}
.wrow .note-w.lifted{transform:rotate(-5deg) scale(1.04)}
.wrow .pocket{position:relative;width:84px;height:78px}

/* boards */
.board{position:relative;width:100%;aspect-ratio:1/1.12;max-width:100%;border-radius:6px;background:color-mix(in srgb,var(--n-sage) 35%,var(--table));border:1px solid var(--table-edge);overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(56%,190px);touch-action:none;cursor:grab;z-index:2;transition:left .5s var(--spring),top .5s var(--spring)}
.pin.lifted{z-index:20;transition:none}
.pin .note{font-size:15.5px;padding:12px 22px 14px 12px}
.pin::before{content:"";position:absolute;left:50%;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral);z-index:3;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--ink-soft);font:400 16px/1.35 var(--serif)}

/* empty spaces scene */
.sil-wrap{display:grid;gap:14px;padding:4px 2px}
.sil{border:1.6px dashed var(--ink-soft);background:transparent;color:var(--ink);text-align:left;font:400 17px/1.22 var(--serif);padding:16px 18px;cursor:pointer;transition:background .4s,transform .4s var(--spring),border-color .3s;width:86%}
.sil:nth-child(odd){border-radius:22px 6px 26px 8px;transform:rotate(-1.5deg)}
.sil:nth-child(even){justify-self:end;border-radius:6px 26px 8px 24px;transform:rotate(1.5deg)}
.sil.kept{border-style:solid;border-color:var(--paper-ink);background:var(--n-blue);color:var(--paper-ink)}
.sil.kept:nth-child(3n){background:var(--n-pink)} .sil.kept:nth-child(3n+1){background:var(--n-butter)}
.sil small{display:block;font:700 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;opacity:.65}

/* keepsake box */
.boxstage{position:relative;height:250px}
.boxstage .box{position:absolute;left:50%;bottom:6px;width:230px;height:160px;transform:translateX(-50%)}
.kbox .lid,.box .lid{position:absolute;left:0;top:-6px;width:100%;transform-origin:50% 100%;transition:transform .8s var(--spring)}
.boxstage.closed .lid{transform:translateY(52px) scaleY(.9)}
.boxstage .note-w{position:absolute;left:50%;top:8px;width:200px;transform:translateX(-50%) rotate(-7deg);transition:transform .7s var(--spring),opacity .5s}
.boxstage.closed .note-w{transform:translateX(-50%) translateY(120px) scale(.5);opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1.25 var(--serif);border:1.2px solid var(--line);background:var(--paper);color:var(--paper-ink);padding:7px 10px;border-radius:3px;cursor:pointer;text-align:left;transition:transform .3s var(--spring),background .2s,opacity .2s}
.chip[aria-pressed=true]{background:var(--n-sage);border-color:var(--paper-ink)}
.chip[aria-pressed=false]{opacity:.65;text-decoration:line-through;text-decoration-color:rgba(61,52,49,.35)}
.field{display:grid;gap:6px}
.field input,.field textarea,.sheet textarea,.sheet input:not([type=checkbox]){font:400 16px/1.35 var(--serif);border:1.2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);color:var(--paper-ink);width:100%}
.field label{font:800 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

/* scrapbook shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;padding-top:4px}
.bk{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:center;font-size:11px}
.bk .cover{position:relative;aspect-ratio:4/5;margin-bottom:6px;transition:transform .45s var(--spring)}
.bk:hover .cover,.bk:focus-visible .cover{transform:rotate(-2.5deg) translateY(-3px)}
.bk .name{position:absolute;left:24%;right:10%;top:22%;background:var(--paper);color:var(--paper-ink);border:1.2px solid var(--paper-ink);font:400 17px/1.1 var(--serif);padding:10px 4px;overflow-wrap:anywhere}
.bk .st{display:block;color:var(--ink-soft)}

/* notebook stage (part two) */
.nb-stage{position:relative;height:300px}
.nb{position:absolute;left:12%;top:0;width:66%;height:94%;perspective:1100px}
.nb .cover{position:absolute;inset:0;transform-origin:0 50%;transition:transform .9s var(--spring);z-index:2;cursor:pointer;touch-action:none}
.nb .inner{position:absolute;inset:3% 2% 3% 4%;background:var(--paper);border:1.3px solid var(--paper-ink);z-index:1;padding:18px;color:var(--paper-ink);font:400 16px/1.3 var(--serif)}
.nb.open .cover{transform:rotateY(-160deg)}
.nb-label{position:absolute;left:26%;top:28%;width:58%;background:var(--paper);border:1.3px solid var(--paper-ink);color:var(--paper-ink);padding:12px;font:400 17px/1.2 var(--serif)}
.kbox{position:absolute;right:0;bottom:2%;width:118px;height:86px}
.kind-row{display:flex;flex-wrap:wrap;gap:6px}

/* scrapbook page */
.page{position:relative;width:100%;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);box-shadow:5px 6px 0 -1px var(--n-pink),5px 6px 0 0 var(--paper-ink),0 12px 22px -12px var(--shadow);overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 27px,rgba(61,52,49,.07) 27px 28px)}
.page.drop{aspect-ratio:1/1.08}
.bub{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(64%,220px);background:var(--b,var(--paper));border:1.3px solid var(--paper-ink);padding:10px 12px 12px;font:400 16px/1.2 var(--serif);color:var(--paper-ink);touch-action:none;cursor:grab;filter:drop-shadow(0 3px 3px var(--shadow));z-index:2;transition:transform .35s var(--spring)}
.bub::after{content:"";position:absolute;bottom:-9px;left:20px;width:15px;height:15px;background:var(--b,var(--paper));border-right:1.3px solid var(--paper-ink);border-bottom:1.3px solid var(--paper-ink);transform:rotate(45deg) skew(10deg,10deg)}
.bub.me::after{left:auto;right:20px}
.bub.pause{border-style:dashed;background:transparent;filter:none}
.bub.pause::after{display:none}
.bub .pr{color:var(--paper-soft);font-size:15px}
.bub small{display:block;font:700 8.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);margin-top:6px}
.bub.lifted{z-index:20;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.05)}
.tok{position:absolute;width:58px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;color:var(--paper-ink);text-align:center;z-index:2;transition:transform .35s var(--spring)}

function parseBiodata(text) {

    const m = line.match(/^\s*([A-Za-z][^:：]{0,40}?)\s*[:：]\s*(.+?)\s*$/);

    (groups[cat] = groups[cat] || []).push({k, v});
  });
  const objects = [];
  const add = (o) => objects.push({id: 'o' + objects.length, ...o});
  const lines = g => (groups[g] || []).map(r => `${r.k}: ${r.v}`);
  const std = cat => { if (!groups[cat]) return; const d = KIND[cat]; add({kind: d.art, title: d.title, about: d.about, known: lines(cat), prompts: d.prompts}); };
  std('occupation'); std('education');

      const hit = HOBBY.find(([re]) => re.test(h));
      const known = [`${cap(h.toLowerCase())} is listed as an interest.`];

      else add({kind: 'tag', word: h.toLowerCase(), title: cap(h.toLowerCase()), about: h.toLowerCase(), known, prompts: [`What do they like about ${h.toLowerCase()}?`, `How did they get into it?`]});

  if (cities.length || groups.places) add({kind: 'map', title: KIND.places.title, about: KIND.places.about, known: [...(cities.length ? [`Places named on the form: ${cities.join(', ')}.`] : []), ...lines('places')], prompts: KIND.places.prompts});

const COVERS = ['#E9B9B3', '#B5C7A9', '#F0DC9A', '#BCD0E0'];
const STATUS = {new: 'Undecided', talking: 'Talking', paused: 'Paused', closed: 'Closed', passed: 'Passed'};
const bookById = id => S.books.find(b => b.id === id);
function newBook(profile, status) { return {id: uid(), name: (profile && profile.name) || 'Someone', created: Date.now(), profile, dismissed: {}, status, meetings: []}; }
// Older saves had drafts, archives and multi-step pages; fold them into one book per person.
(function migrate() {
  S.books = (S.books || []).map(b => b.meetings ? b : {
    id: b.id, name: b.name, created: b.created || Date.now(), example: b.example, profile: null, dismissed: {},
    status: {continuing: 'talking', paused: 'paused', closed: 'closed'}[b.status] || 'talking',
    meetings: (b.pages || []).map(pg => ({id: pg.id, date: pg.date, kind: pg.kind || '', topics: {}, tokens: (pg.tokens || []).map(t => t.type),
      note: [...(pg.fragments || []).filter(f => f.text).map(f => f.text), ...(pg.notes || []).map(n => n.text), ...Object.values(pg.prefNotes || {}), pg.next ? pg.next.text : ''].filter(Boolean).join('\n')}))
  });
  (S.archived || []).forEach(a => { if (a.draft && a.draft.profile) S.books.push(newBook(a.draft.profile, 'passed')); });
  if (S.draft && S.draft.profile) S.books.unshift(newBook(S.draft.profile, 'new'));
  S.archived = []; S.draft = null;
})();
const meetEmpty = m => !m.kind && !m.note && !m.tokens.length && !Object.keys(m.topics).length;
const squiggle = () => S.settings.reduced ? IC.squiggle : IC.squiggle.replace('"/></svg>', '"><animate attributeName="d" dur="2.6s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="M3 8c14-5 24 4 38-1s24-4 38 0 26 3 40-2 10-1 14 0;M3 8c14 5 24-4 38 1s24 4 38 0 26-3 40 2 10 1 14 0;M3 8c14-5 24 4 38-1s24-4 38 0 26 3 40-2 10-1 14 0"/></path></svg>');
const toPrefs = () => go(onb().done && mine().length ? 'mine' : 'onb');

// The filter check: a stamp lands on the form, then the reasons, then Pass or Explore.
SCENES.check = (o) => {
  const b = bookById(o.book), p = b && b.profile; if (!p) return SCENES.home();
  b.dismissed = b.dismissed || {};

  const inc = c.items.filter(i => i.state === 'conflict'), cur = c.items.filter(i => i.state === 'aligned' || i.rel), fq = directions(c), shown = o.allDirs ? fq : fq.slice(0, 3);

  return {
    tone: 'butter', eyebrow: 'Filter check',
    html: `<div class="who">${p.photo ? `<span class="polaroid"><img src="${p.photo}" alt=""></span>` : ''}<h1 class="t">${esc(p.name || 'This profile')}</h1></div>
    <div class="fold readpaper${o.intro ? ' rise' : ''}" id="bio" role="button" tabindex="0" aria-label="View the biodata"><span class="tape"></span><div class="panel"><p class="bd-om">॥ SHREE GANESHAYA NAMAH ॥</p><p class="bd-title">BIODATA</p>${p.rows.slice(0, 6).map(x => `<div class="bd-row${x.hide ? ' hide' : ''}"><b>${esc(x.k)}</b><span>${esc(x.v)}</span></div>`).join('')}</div><span class="stamp-mark" style="--sc:${c.flags ? '#B4462F' : '#4F6B45'}">${c.items.length ? flagText(c.flags).toUpperCase() : 'UNSORTED'}</span></div>

    <div class="scrap">
    <section class="rs"><h2>Potential incompatibilities</h2>${inc.map((i, n) => entry({text: i.pref.text, color: 'pink', state: 'conflict', small: CATL[i.pref.cat], quote: i.quote, n, dim: i.dismissed,
      foot: i.flag ? `<button class="tagbtn" data-dis="${i.pref.id}">${i.dismissed ? 'Undo' : 'Not a dealbreaker'}</button>` : '<span class="hand">Worth a thought</span>'})).join('') || none('None stated.')}</section>
    <section class="rs"><h2>Reasons for curiosity</h2>${cur.map((i, n) => entry({text: i.pref.text, color: i.rel ? 'blue' : 'sage', state: i.rel ? 'related' : 'aligned', small: i.rel ? 'Related, not proof' : CATL[i.pref.cat], quote: i.quote || i.rel, n})).join('') || none('Nothing stated yet.')}</section>
    <section class="rs"><h2>Talk about</h2>${shown.map((x, n) => entry({text: x.topic, color: '', listen: x, small: `${x.why} · ${x.pref.text}`, n})).join('') || none('Nothing yet.')}${fq.length > shown.length ? `<button class="btn link" id="moreq">${fq.length - shown.length} more</button>` : ''}</section>
    </div>`}

// Tap an object from the form: it comes up close, moving gently, with what the form says.
function inspectSheet(ob, p) {
  const q = ob.prompts[0];
  sheet(`<h3>${esc(ob.title)}</h3><div class="big" data-anim="${IDLE[ob.kind] || 'float'}" style="--r:0deg;margin:6px auto">${artFor(ob, p.photo)}</div>
  <div class="clips">${ob.known.map((k, n) => clipHtml(k, n)).join('')}</div>${q ? pointsTo(q) : ''}<button class="btn primary" data-x>Close</button>`, (sh, close) => {
    $('[data-x]', sh).onclick = close;
    const big = $('.big', sh); let x0 = null, r0 = 0, rr = 0; big.style.touchAction = 'none';
    big.addEventListener('pointerdown', e => { x0 = e.clientX; r0 = rr; try { big.setPointerCapture(e.pointerId); } catch (_) {} });
    big.addEventListener('pointermove', e => { if (x0 === null) return; rr = r0 + (e.clientX - x0) * .8; big.style.setProperty('--r', rr + 'deg'); });
    const up = () => { x0 = null; }; big.addEventListener('pointerup', up); big.addEventListener('pointercancel', up);
    big.addEventListener('dblclick', () => { rr += 180; big.style.setProperty('--r', rr + 'deg'); sfx('lift'); });
  });
}
function statusSheet(b) {

  });
}
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'});

// After a meeting: flick each topic card into "came up" or "didn't", tap a few moments, done.

  const deck = dirs.filter(x => !(x.topic in m.topics)), top = deck[0];
  const upN = dirs.filter(x => m.topics[x.topic] && m.topics[x.topic].up).length, downN = dirs.filter(x => m.topics[x.topic] && !m.topics[x.topic].up).length;

    <p class="label">Moments</p>

    <textarea class="note-area" id="nt" aria-label="Note" placeholder="Anything else? (optional)">${esc(m.note)}</textarea>
    <p class="label">Keep talking?</p>
    <div class="seg" id="stat">${[['talking', 'Yes'], ['paused', 'Pause'], ['closed', 'Close']].map(([s, l]) => `<button data-s="${s}" aria-pressed="${b.status === s}">${l}</button>`).join('')}</div>
    <div class="actions"><button class="btn primary" id="done">Done</button></div>`,
    mount: r => {
      const decide = up => {
        if (!top) return;
        const card = $('#card', r); m.topics[top.topic] = {up}; save(); sfx('tuck'); buzz(8);
        card.style.transition = 'transform .25s ease, opacity .25s'; card.style.transform = `translateX(${up ? 130 : -130}%) rotate(${up ? 16 : -16}deg)`; card.style.opacity = 0;
        setTimeout(render, S.settings.reduced ? 0 : 230);
      };
      on(r, '#yes', () => decide(true)); on(r, '#no', () => decide(false));
      const card = $('#card', r);
      if (card) {
        let sx = null, pid = null; card.style.touchAction = 'pan-y';
        card.addEventListener('pointerdown', e => { sx = e.clientX; pid = e.pointerId; try { card.setPointerCapture(pid); } catch (_) {} });
        card.addEventListener('pointermove', e => { if (e.pointerId !== pid || sx === null) return; const dx = e.clientX - sx; card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; card.classList.toggle('lean-yes', dx > 50); card.classList.toggle('lean-no', dx < -50); });
        const up = e => { if (e.pointerId !== pid || sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 80) decide(dx > 0); else { card.style.transform = ''; card.classList.remove('lean-yes', 'lean-no'); } };
        card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
        card.addEventListener('keydown', e => { if (e.key === 'ArrowRight') decide(true); if (e.key === 'ArrowLeft') decide(false); });
      }
      on(r, '#pile', () => sheet(`<h3>Sorted</h3>${dirs.filter(x => x.topic in m.topics).map((x, n) => `<div class="arch"><span>${m.topics[x.topic].up ? '✓' : '–'} ${esc(x.topic)}</span><span class="seg"><button data-u="${n}">Undo</button></span></div>`).join('')}<button class="btn primary" data-x>Close</button>`, (sh, close) => {
        const sorted = dirs.filter(x => x.topic in m.topics);
        on(sh, '[data-u]', (e, x) => { delete m.topics[sorted[+x.dataset.u].topic]; save(); close(); render(); });
        $('[data-x]', sh).onclick = close;
      }));
      on(r, '#kind button', (e, x) => { m.kind = m.kind === x.dataset.k ? '' : x.dataset.k; $$('#kind button', r).forEach(y => y.setAttribute('aria-pressed', y.dataset.k === m.kind)); sfx('tuck'); save(); });
      on(r, '.tokbtn', (e, x) => { const t = x.dataset.t, i = m.tokens.indexOf(t); if (i >= 0) m.tokens.splice(i, 1); else m.tokens.push(t); x.setAttribute('aria-pressed', i < 0); x.classList.remove('pop'); void x.offsetWidth; if (i < 0) x.classList.add('pop'); sfx(i < 0 ? 'drop' : 'tuck'); buzz(6); save(); });
      $('#nt', r).addEventListener('input', e => { m.note = e.target.value; save(); });
      on(r, '#stat button', (e, x) => { b.status = x.dataset.s; $$('#stat button', r).forEach(y => y.setAttribute('aria-pressed', y.dataset.s === b.status)); sfx('drop'); save(); });
      on(r, '#done', () => { if (meetEmpty(m)) b.meetings = b.meetings.filter(y => y !== m); else toast('Saved'); save(); back(); });
    }
  };
};

/* ---------- example book for a first look ---------- */
function exampleBook() {
  const p = parseBiodata(SAMPLE), b = newBook(p, 'talking'); b.example = true;
  const dirs = directions(compare(p, b)), topics = {};
  dirs.slice(0, 3).forEach((x, i) => { topics[x.topic] = {up: i !== 1}; });
  const day = 864e5;
  b.meetings = [
    {id: uid(), date: Date.now() - 12 * day, kind: 'Call', topics, tokens: ['curiosity', 'laughter'], note: 'Talked about books for ages. He rereads the same three.'},
    {id: uid(), date: Date.now() - 3 * day, kind: 'Coffee', topics: {}, tokens: ['laughter', 'surprise'], note: 'Funny story about a football trophy. Mentioned Sunday lunches at his parents’.'}
  ];
  return b;
}

/* ---------- settings + privacy ---------- */
function openSettings() {
  const st = S.settings;
  sheet(`<h3>Settings</h3>
  <label class="tog"><span>Reduced motion</span><input type="checkbox" class="sw" id="s-rm" ${st.reduced ? 'checked' : ''}></label>
  <label class="tog"><span>Paper sounds</span><input type="checkbox" class="sw" id="s-snd" ${st.sound ? 'checked' : ''}></label>
  <label class="tog"><span>Haptics</span><input type="checkbox" class="sw" id="s-hap" ${st.haptics ? 'checked' : ''}></label>
  <p>Saved only in this browser. Contact details are never kept.</p>
  <button class="btn" id="s-f">My preferences</button>
  <div class="row2"><button class="btn" id="s-all">Delete everything</button><button class="btn primary" data-x>Done</button></div>`, (sh, close) => {
    $('#s-rm', sh).onchange = e => { st.reduced = e.target.checked; applyMotion(); save(); };
    $('#s-snd', sh).onchange = e => { st.sound = e.target.checked; save(); if (st.sound) sfx('page'); };
    $('#s-hap', sh).onchange = e => { st.haptics = e.target.checked; save(); buzz(10); };
    $('[data-x]', sh).onclick = close;
    $('#s-f', sh).onclick = () => { close(); toPrefs(); };
    $('#s-all', sh).onclick = () => { close(); confirmSheet('Delete everything?', 'This can’t be undone.', 'Delete', () => { const keep = S.settings; S = fresh(); S.settings = keep; try { localStorage.removeItem(KEY); } catch (e) {} save(); toast('Deleted'); go('home', {}, 'reset'); }); };
  });
}

cur = {name: onb().done || S.books.length ? 'home' : 'onb', opts: {}};
render();
})();
</script>
