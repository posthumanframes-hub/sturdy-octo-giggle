<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot Twist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column; each scene = eyebrow bar, serif headline, a tactile stage, quiet paper buttons. Chapter One lives on butter, Chapter Two on dusty pink, the in-between on sage. */
:root{
  --butter-bg:#F7EDCB; --cream-bg:#FBF6EC; --sage-bg:#E2E8D9; --pink-bg:#F1DDD6; --blue-bg:#DEE8EF;
  --ink:#3D3431; --ink-soft:#73665F; --line:rgba(61,52,49,.18);
  --paper:#FFFCF5; --paper-ink:#3D3431; --paper-soft:#7A6D66;
  --coral:#C65A43; --coral-ink:#FFF8F0;
  --n-butter:#F3E2A6; --n-pink:#EDC3BC; --n-blue:#CFDDE8; --n-sage:#C3D3B8; --n-cream:#FFFCF5;
  --table:#FBF4E2; --table-edge:rgba(61,52,49,.14);
  --shadow:rgba(61,52,49,.16);
  --serif:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --bg:var(--butter-bg);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B;
  --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2);
  --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4);
  --coral:#D86A50; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B;
  --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2);
  --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4);
  --coral:#D86A50; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .6s ease;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
body[data-tone=butter]{--bg:var(--butter-bg)}
body[data-tone=cream]{--bg:var(--cream-bg)}
body[data-tone=sage]{--bg:var(--sage-bg)}
body[data-tone=pink]{--bg:var(--pink-bg)}
body[data-tone=blue]{--bg:var(--blue-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:3px;border-radius:6px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.bar{display:flex;align-items:center;gap:10px;min-height:46px}
.eyebrow{flex:1;font:800 9.5px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.icon-btn{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px var(--shadow)}
.icon-btn.back{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.scene{flex:1;display:flex;flex-direction:column;gap:14px;animation:sceneIn .55s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.t{font:400 clamp(28px,8.4vw,35px)/1.08 var(--serif);letter-spacing:-.015em;margin:12px 0 0;text-wrap:balance;outline:none}
.sub{color:var(--ink-soft);margin:-4px 0 0;font-size:13.5px;line-height:1.45;max-width:36ch}
.label{font:800 9.5px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.label.w{color:var(--coral)}
.hint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:0;line-height:1.5}
.actions{display:grid;gap:8px;margin-top:auto;padding-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 13.5px/1.2 var(--sans);border-radius:8px;padding:13px 14px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--spring),box-shadow .2s;box-shadow:0 1px 2px var(--shadow);text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--coral);color:var(--coral-ink);border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.btn.link{background:none;border:0;box-shadow:none;color:var(--ink-soft);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);padding-top:16px}
.foot svg{width:11px;height:11px}
.ill{display:block;width:100%;height:100%;overflow:visible;filter:url(#wobble)}

/* paper notes */
.note-w{filter:drop-shadow(0 3px 5px var(--shadow));transition:transform .35s var(--spring)}
.note{--n:var(--n-butter);position:relative;background:var(--n);color:var(--paper-ink);font:400 18px/1.18 var(--serif);padding:16px 26px 18px 16px;border:1.3px solid var(--paper-ink);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.note::after{content:"";position:absolute;top:-1px;right:-1px;width:21px;height:21px;background:linear-gradient(225deg,transparent 48%,var(--paper-ink) 48% 54%,rgba(0,0,0,.08) 54%)}
.note small{display:block;font:700 9.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:8px}
.note.pink{--n:var(--n-pink)} .note.blue{--n:var(--n-blue)} .note.sage{--n:var(--n-sage)} .note.cream{--n:var(--n-cream)}
.tape{position:absolute;width:46px;height:14px;background:rgba(243,226,166,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);transform:rotate(-4deg)}

/* hero illustrations */
.hero{position:relative;height:250px;margin:4px 0;pointer-events:none}
.hero .env,.chapter .env{touch-action:auto}
.page .empty{color:var(--paper-soft)}
.mini-known .label{color:var(--paper-soft)}
.nb .cover{backface-visibility:hidden}
.hero > *{position:absolute}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(var(--r,0deg))}}
.squiggle{width:136px;height:12px;color:var(--coral);margin-top:-2px}
.display{font:400 clamp(54px,17vw,72px)/.92 var(--serif);letter-spacing:-.03em;margin:22px 0 0;outline:none}
.lede{font-size:15px;margin:0}
.card-btn{display:block;text-align:left;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;font-size:11px;line-height:1.5;box-shadow:0 1px 2px var(--shadow)}
.card-btn b{font-size:11.5px;display:block}
.card-btn span{color:var(--paper-soft)}

/* chapter select */
.chapter{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;color:var(--ink)}
.chapter.flip{grid-template-columns:110px 1fr}
.chapter h2{font:400 22px/1.15 var(--serif);margin:0 0 6px}
.chapter p{margin:0;font-size:13px;color:var(--ink-soft)}
.chapter .pic{height:110px;transition:transform .4s var(--spring)}
.chapter:hover .pic,.chapter:focus-visible .pic{transform:rotate(-3deg) translateY(-3px)}
.dash{border:0;border-top:1.5px dashed var(--line);margin:4px 0;width:100%}

/* envelope */
.env{position:relative;width:min(100%,320px);aspect-ratio:3/2;margin:14px auto 0;perspective:900px;touch-action:none}
.env > *{position:absolute;left:0;width:100%}
.env-body{top:0;height:100%;z-index:1}
.env-paper{left:7%;width:86%;top:8%;height:84%;z-index:2;background:var(--paper);border:1.3px solid var(--paper-ink);border-radius:2px;transition:transform .8s var(--spring);padding:12px 14px;color:var(--paper-ink);font:400 13px/1.3 var(--serif)}
.env-paper i{display:block;height:5px;margin:7px 0;background:rgba(61,52,49,.12);border-radius:3px}
.env-front{top:0;height:100%;z-index:3;pointer-events:none}
.env-flap{top:0;height:62%;z-index:4;transform-origin:50% 0;transition:transform .7s var(--spring);transform-style:preserve-3d;cursor:grab}
.env-flap.dragging{transition:none}
.env.open .env-flap{transform:rotateX(178deg);z-index:0}
.env.open .env-paper{transform:translateY(-58%)}
.pull{position:absolute;right:10%;top:-4%;background:var(--n-butter);border:1.3px solid var(--paper-ink);color:var(--paper-ink);font:600 11px var(--serif);padding:4px 9px;transform:rotate(-8deg);z-index:5;pointer-events:none}
.env-label{position:absolute;left:30%;top:56%;z-index:3;background:var(--paper);border:1.3px solid var(--paper-ink);color:var(--paper-ink);padding:6px 10px;font:600 11px/1.25 var(--sans);transform:rotate(-2deg);pointer-events:none}
.env-arc{position:absolute;right:-2%;top:-22%;width:60px;height:70px;color:var(--coral);z-index:6;pointer-events:none}

/* biodata paper */
.fold{position:relative;width:min(100%,330px);margin:6px auto 0;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);box-shadow:0 8px 18px -8px var(--shadow);transform:rotate(-1.2deg);touch-action:pan-y;cursor:pointer}
.panel{padding:12px 18px;overflow:hidden;transform-origin:50% 0;transition:max-height .65s var(--spring),transform .65s var(--spring),opacity .4s,padding .4s;max-height:420px}
.panel + .panel{border-top:1.2px dashed rgba(61,52,49,.3)}
.panel.shut{max-height:0;opacity:.2;transform:perspective(600px) rotateX(-85deg);padding-block:0}
.bd-om{text-align:center;font:600 10px/1.2 var(--sans);letter-spacing:.14em;color:var(--coral);margin:2px 0 4px}
.bd-title{text-align:center;font:600 20px/1.1 var(--serif);letter-spacing:.18em;margin:0 0 8px}
.bd-row{display:grid;grid-template-columns:42% 1fr;gap:8px;font-size:11.5px;line-height:1.35;padding:2.5px 0;border-bottom:1px dotted rgba(61,52,49,.18)}
.bd-row b{font-weight:700;color:var(--paper-soft)}
.bd-row.hide span{font-style:italic;color:var(--paper-soft)}
.bd-empty{font:400 26px/1.15 var(--serif);padding:22px 4px 26px}
.fold .tape{left:42%;top:-8px}

/* tabletop */
.tabletop{position:relative;width:100%;background:var(--table);border:1px solid var(--table-edge);border-radius:6px;box-shadow:inset 0 0 40px rgba(120,90,40,.06),0 10px 24px -14px var(--shadow);overflow:hidden}
.obj{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;transition:left .7s var(--spring),top .7s var(--spring),transform .35s var(--spring),opacity .4s,filter .2s;filter:drop-shadow(0 3px 2px var(--shadow));z-index:2}
.obj.lifted{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.14);filter:drop-shadow(0 12px 10px var(--shadow));z-index:20;transition:transform .3s var(--spring),filter .2s;cursor:grabbing}
.obj.packed{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.obj.seen::after{content:"";position:absolute;right:4px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--coral);opacity:.55}
.pocket{position:absolute;width:78px;height:72px;background:none;border:0;padding:0;cursor:pointer;z-index:3;transition:transform .35s var(--spring)}
.pocket.hot{transform:scale(1.12) rotate(-3deg)}
.pocket .cnt{position:absolute;left:0;right:0;top:44%;text-align:center;font:700 10px var(--sans);color:#2f3a2c}
.space{position:absolute;transform:translate(-50%,-50%);border:1.6px dashed var(--ink-soft);border-radius:40% 55% 45% 50%;width:72px;height:64px;display:grid;place-items:center;color:var(--ink-soft);background:none;cursor:pointer;font:400 22px var(--serif);animation:fadeIn 1s ease both;z-index:1}
@keyframes fadeIn{from{opacity:0}}
.source{position:absolute;left:8%;top:10%;width:46%;transform:rotate(-3deg);background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);padding:12px;font:400 15px/1.2 var(--serif);cursor:pointer}
.source small{display:block;font:800 8.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;color:var(--paper-soft)}

/* inspect */
.inspect{display:grid;grid-template-columns:1fr;gap:10px}
.big{width:150px;height:150px;margin:2px auto 0;transform:rotate(var(--r,0deg));transition:transform .5s var(--spring);touch-action:none;cursor:grab;filter:drop-shadow(0 10px 8px var(--shadow))}
.big.dragging{transition:none}
.rot{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.rot .icon-btn{width:34px;height:34px}
.known{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.known ul{margin:6px 0 0;padding-left:16px}
.known .label{color:var(--paper-soft)}
.wrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:end}
.wrow .note-w{touch-action:none;cursor:grab;transform:rotate(-2deg)}
.wrow .note-w.lifted{transform:rotate(-5deg) scale(1.04)}
.wrow .pocket{position:relative;width:84px;height:78px}

/* boards */
.board{position:relative;width:100%;aspect-ratio:1/1.12;max-width:100%;border-radius:6px;background:color-mix(in srgb,var(--n-sage) 35%,var(--table));border:1px solid var(--table-edge);overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(56%,190px);touch-action:none;cursor:grab;z-index:2;transition:left .5s var(--spring),top .5s var(--spring)}
.pin.lifted{z-index:20;transition:none}
.pin .note{font-size:15.5px;padding:12px 22px 14px 12px}
.pin::before{content:"";position:absolute;left:50%;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral);z-index:3;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--ink-soft);font:400 16px/1.35 var(--serif)}

/* empty spaces scene */
.sil-wrap{display:grid;gap:14px;padding:4px 2px}
.sil{border:1.6px dashed var(--ink-soft);background:transparent;color:var(--ink);text-align:left;font:400 17px/1.22 var(--serif);padding:16px 18px;cursor:pointer;transition:background .4s,transform .4s var(--spring),border-color .3s;width:86%}
.sil:nth-child(odd){border-radius:22px 6px 26px 8px;transform:rotate(-1.5deg)}
.sil:nth-child(even){justify-self:end;border-radius:6px 26px 8px 24px;transform:rotate(1.5deg)}
.sil.kept{border-style:solid;border-color:var(--paper-ink);background:var(--n-blue);color:var(--paper-ink)}
.sil.kept:nth-child(3n){background:var(--n-pink)} .sil.kept:nth-child(3n+1){background:var(--n-butter)}
.sil small{display:block;font:700 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;opacity:.65}

/* keepsake box */
.boxstage{position:relative;height:250px}
.boxstage .box{position:absolute;left:50%;bottom:6px;width:230px;height:160px;transform:translateX(-50%)}
.kbox .lid,.box .lid{position:absolute;left:0;top:-6px;width:100%;transform-origin:50% 100%;transition:transform .8s var(--spring)}
.boxstage.closed .lid{transform:translateY(52px) scaleY(.9)}
.boxstage .note-w{position:absolute;left:50%;top:8px;width:200px;transform:translateX(-50%) rotate(-7deg);transition:transform .7s var(--spring),opacity .5s}
.boxstage.closed .note-w{transform:translateX(-50%) translateY(120px) scale(.5);opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1.25 var(--serif);border:1.2px solid var(--line);background:var(--paper);color:var(--paper-ink);padding:7px 10px;border-radius:3px;cursor:pointer;text-align:left;transition:transform .3s var(--spring),background .2s,opacity .2s}
.chip[aria-pressed=true]{background:var(--n-sage);border-color:var(--paper-ink)}
.chip[aria-pressed=false]{opacity:.65;text-decoration:line-through;text-decoration-color:rgba(61,52,49,.35)}
.field{display:grid;gap:6px}
.field input,.field textarea,.sheet textarea,.sheet input:not([type=checkbox]){font:400 16px/1.35 var(--serif);border:1.2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);color:var(--paper-ink);width:100%}
.field label{font:800 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

/* scrapbook shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;padding-top:4px}
.bk{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:center;font-size:11px}
.bk .cover{position:relative;aspect-ratio:4/5;margin-bottom:6px;transition:transform .45s var(--spring)}
.bk:hover .cover,.bk:focus-visible .cover{transform:rotate(-2.5deg) translateY(-3px)}
.bk .name{position:absolute;left:24%;right:10%;top:22%;background:var(--paper);color:var(--paper-ink);border:1.2px solid var(--paper-ink);font:400 17px/1.1 var(--serif);padding:10px 4px;overflow-wrap:anywhere}
.bk .st{display:block;color:var(--ink-soft)}

/* notebook stage (part two) */
.nb-stage{position:relative;height:300px}
.nb{position:absolute;left:12%;top:0;width:66%;height:94%;perspective:1100px}
.nb .cover{position:absolute;inset:0;transform-origin:0 50%;transition:transform .9s var(--spring);z-index:2;cursor:pointer;touch-action:none}
.nb .inner{position:absolute;inset:3% 2% 3% 4%;background:var(--paper);border:1.3px solid var(--paper-ink);z-index:1;padding:18px;color:var(--paper-ink);font:400 16px/1.3 var(--serif)}
.nb.open .cover{transform:rotateY(-160deg)}
.nb-label{position:absolute;left:26%;top:28%;width:58%;background:var(--paper);border:1.3px solid var(--paper-ink);color:var(--paper-ink);padding:12px;font:400 17px/1.2 var(--serif)}
.kbox{position:absolute;right:0;bottom:2%;width:118px;height:86px}
.kind-row{display:flex;flex-wrap:wrap;gap:6px}

/* scrapbook page */
.page{position:relative;width:100%;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--paper-ink);box-shadow:5px 6px 0 -1px var(--n-pink),5px 6px 0 0 var(--paper-ink),0 12px 22px -12px var(--shadow);overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 27px,rgba(61,52,49,.07) 27px 28px)}
.page.drop{aspect-ratio:1/1.08}
.bub{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(64%,220px);background:var(--b,var(--paper));border:1.3px solid var(--paper-ink);padding:10px 12px 12px;font:400 16px/1.2 var(--serif);color:var(--paper-ink);touch-action:none;cursor:grab;filter:drop-shadow(0 3px 3px var(--shadow));z-index:2;transition:transform .35s var(--spring)}
.bub::after{content:"";position:absolute;bottom:-9px;left:20px;width:15px;height:15px;background:var(--b,var(--paper));border-right:1.3px solid var(--paper-ink);border-bottom:1.3px solid var(--paper-ink);transform:rotate(45deg) skew(10deg,10deg)}
.bub.me::after{left:auto;right:20px}
.bub.pause{border-style:dashed;background:transparent;filter:none}
.bub.pause::after{display:none}
.bub .pr{color:var(--paper-soft);font-size:15px}
.bub small{display:block;font:700 8.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);margin-top:6px}
.bub.lifted{z-index:20;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.05)}
.tok{position:absolute;width:58px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;color:var(--paper-ink);text-align:center;z-index:2;transition:transform .35s var(--spring)}
.tok svg{width:54px;height:54px;display:block;margin:0 auto;filter:drop-shadow(0 3px 2px var(--shadow))}
.tok span{font:600 10px/1.1 var(--serif);display:block;margin-top:1px}
.tok.lifted{z-index:20;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.15)}
.tok .nt{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--coral)}

function shrinkImage(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82));
    }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

    if (!d) return; e.preventDefault();
    const p = o.get(); const x = clamp(p.x + d[0] * .03, lo, hi), y = clamp(p.y + d[1] * .03, lo, hi);
    o.set(x, y); o.end && o.end(x, y, null);
  });
}
const place = (el, x, y) => { el.style.left = (x * 100) + '%'; el.style.top = (y * 100) + '%'; };
const over = (e, target) => { if (!e || !target) return false; const r = target.getBoundingClientRect(); return e.clientX >= r.left - 10 && e.clientX <= r.right + 10 && e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10; };

/* ---------- draft helpers (Part One) ---------- */
const draft = () => S.draft || (S.draft = {id: uid(), profile: null, opened: false, placed: {}, seen: [], pocket: [], spaces: false, kept: []});
const objById = id => (S.draft?.profile?.objects || []).find(o => o.id === id);
function tuck(text, src) {
  const d = draft();
  if (d.pocket.some(n => n.text === text)) return false;
  const k = d.pocket.length;
  d.pocket.push({id: uid(), text, src, c: NOTE_COLORS[k % 4], x: (k % 2 ? .64 : .36) + (rnd() - .5) * .08, y: .12 + (Math.floor(k / 2) % 5) * .19 + (k % 2) * .06, r: Math.round(rnd() * 8 - 4)});
  save(); sfx('tuck'); buzz(10); return true;
}
function layoutTable(objs) {
  const n = objs.length, cols = 4, rows = Math.max(3, Math.ceil((n + 2) / cols));
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (r === rows - 1 && (c === cols - 1 || c === 0)) continue; // pocket + empty space live here
    cells.push([(c + .5) / cols, (r + .5) / rows]);
  }
  return {rows, cells};
}

  const pk = d.pocket.length;

  return {
    tone: 'butter', eyebrow: '01 Filter In · The table',
    html: `<h1 class="t">Take a look.</h1>

      <button class="btn primary" id="board">My questions</button>
      <div class="${d.spaces ? 'row2' : ''}">${d.spaces ? '<button class="btn" id="spaces">Not on the form</button>' : ''}<button class="btn" id="done" style="width:100%">Done</button></div>
    </div>`,
    mount: r => {

        requestAnimationFrame(() => els.forEach((el, i) => setTimeout(() => { const p = d.placed[el.dataset.id]; place(el, p.x, p.y); el.classList.remove('packed'); if (i % 3 === 0) sfx('lift'); }, 120 + i * 90)));
        cur.opts = {};
      }
      $$('.obj', r).forEach(el => {
        const id = el.dataset.id;

          move: e => pocket.classList.toggle('hot', over(e, pocket)),
          end: (x, y, e) => {

SCENES.inspect = (o) => {
  const d = draft(), ob = objById(o.id);
  if (!ob) return SCENES.table({});
  if (!d.seen.includes(ob.id)) d.seen.push(ob.id);
  const firstReveal = !d.spaces && d.seen.length >= 3;
  if (firstReveal) d.spaces = true;
  let pi = 0;
  const pos = d.placed[ob.id] || {r: 0};

    tone: 'butter', eyebrow: '01 Filter In · Inspect',
    html: `<h1 class="t">${esc(ob.title)}</h1>

      <button class="pocket" id="pk" aria-label="Pocket">${POCKET(d.pocket.length)}</button></div>
    </div>
        <div class="actions">
      <button class="btn primary" id="save">Save</button>
      <div class="row2"><button class="btn" id="own">${IC.pen} Write my own</button><button class="btn" id="another">Another</button></div>
      <button class="btn link" id="leave">Back</button>
    </div>`,
    mount: r => {
      const big = $('#big', r), wt = $('#wt', r), wn = $('#wn', r), pk = $('#pk', r);
      const show = () => {
        const q = ob.prompts[pi];
        wt.innerHTML = q ? esc(q) : 'Nothing to ask here.';
        const inPocket = q && d.pocket.some(n => n.text === q);
        $('#save', r).textContent = inPocket ? 'Saved' : 'Save';
        $('#save', r).disabled = !q || inPocket; $('#save', r).style.opacity = (!q || inPocket) ? .55 : 1;
        $('#another', r).hidden = ob.prompts.length < 2;
      };
      show();
      if (firstReveal) setTimeout(() => toast('New on the table'), 500);
      const turn = deg => { pos.r = ((pos.r || 0) + deg); big.style.setProperty('--r', pos.r + 'deg'); sfx('lift'); save(); };
      on(r, '#ccw', () => turn(-30)); on(r, '#cw', () => turn(30));
      let px = null, r0 = 0;
      big.addEventListener('pointerdown', e => { px = e.clientX; r0 = pos.r || 0; big.classList.add('dragging'); try { big.setPointerCapture(e.pointerId); } catch (_) {} });
      big.addEventListener('pointermove', e => { if (px === null) return; pos.r = Math.round(r0 + (e.clientX - px) * .8); big.style.setProperty('--r', pos.r + 'deg'); });
      const up = () => { if (px === null) return; px = null; big.classList.remove('dragging'); save(); };
      big.addEventListener('pointerup', up); big.addEventListener('pointercancel', up);
      const keep = () => {
        const q = ob.prompts[pi]; if (!q) return;
        if (tuck(q, ob.id)) { toast('Saved'); $('.cnt', pk).textContent = d.pocket.length + ' in pocket'; pk.classList.add('hot'); setTimeout(() => pk.classList.remove('hot'), 350); }
        show();
      };
      on(r, '#save', keep);
      on(r, '#another', () => { pi = (pi + 1) % ob.prompts.length; wn.style.transform = 'rotate(4deg) translateY(-6px)'; setTimeout(() => wn.style.transform = '', 220); sfx('page'); show(); });
      on(r, '#own', () => askText({title: 'Your question', placeholder: 'I wonder…', ok: 'Save'}, t => { if (t && tuck(t, ob.id)) { toast('Saved'); $('.cnt', pk).textContent = d.pocket.length + ' in pocket'; } }));
      on(r, '#leave', back);
      // drag the note into the pocket
      let sx = 0, sy = 0, pid = null;
      wn.style.touchAction = 'none';
      wn.addEventListener('pointerdown', e => { pid = e.pointerId; sx = e.clientX; sy = e.clientY; try { wn.setPointerCapture(pid); } catch (_) {} wn.classList.add('lifted'); });
      wn.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; wn.style.transform = `translate(${e.clientX - sx}px,${e.clientY - sy}px) rotate(-5deg)`; pk.classList.toggle('hot', over(e, pk)); });
      const wup = e => { if (e.pointerId !== pid) return; pid = null; wn.classList.remove('lifted'); wn.style.transform = ''; pk.classList.remove('hot'); if (over(e, pk)) keep(); };
      wn.addEventListener('pointerup', wup); wn.addEventListener('pointercancel', wup);
      wn.addEventListener('keydown', e => { if (e.key === 'Enter') keep(); });
    }
  };
};

SCENES.pack = (o) => {

function archiveDraft(how) {
  const d = draft(), passed = how === 'Passed';
  S.archived.unshift({id: d.id, name: (d.profile?.name || 'Unnamed paperwork') + (passed ? ' · passed' : ''), at: Date.now(), draft: d});
  S.draft = null; save(); toast(passed ? 'Passed' : 'Archived'); go('chapters', {}, 'reset');
}

const flagText = n => n ? `${n} pass flag${n > 1 ? 's' : ''}` : 'No pass flags';
const evPill = st => `<span class="ev ${st}">${{aligned: 'Aligned', conflict: 'Conflict', unknown: 'Unknown', related: 'Related'}[st]}</span>`;
const quoteHtml = q => q ? `<q>${esc(q.k)}: “${esc(q.s)}”</q>` : '';

SCENES.read = () => {
  const d = draft(), p = d.profile;
  if (!p) return SCENES.unfold();
  d.dismissed = d.dismissed || {}; d.asked = d.asked || [];
  const c = compare(p, d);
  const inc = c.items.filter(i => i.state === 'conflict'), cur = c.items.filter(i => i.state === 'aligned' || i.rel), fq = firstQuestions(c, p), shown = d.showAllQ ? fq : fq.slice(0, 5);
  const none = t => `<p class="none">${t}</p>`;
  return {
    tone: 'butter', eyebrow: '01 Filter In · Filter check',
    html: `<div class="who">${p.photo ? `<img src="${p.photo}" alt="">` : ''}<h1 class="t">${esc(p.name || 'This profile')}</h1></div>
    <div class="row-pills"><span class="status">${flagText(c.flags)}</span><button class="btn link" id="bio">View biodata</button></div>
    ${!c.items.length ? `<div class="checkin"><p class="q">No sorted preferences yet.</p><button class="btn" id="setup">Set up my preferences</button></div>` : `
    <section class="rs"><h2>Potential incompatibilities</h2>${inc.map(i => `<div class="ri${i.dismissed ? ' dim' : ''}"><div class="ri-h"><span>${esc(i.pref.text)}</span>${evPill('conflict')}</div>${quoteHtml(i.quote)}<div class="ri-f"><span>${CATL[i.pref.cat]}</span>${i.flag ? `<button data-dis="${i.pref.id}">${i.dismissed ? 'Undo' : 'Not a dealbreaker'}</button>` : '<span>Consider</span>'}</div></div>`).join('') || none('None stated.')}</section>
    <section class="rs"><h2>Reasons for curiosity</h2>${cur.map(i => `<div class="ri"><div class="ri-h"><span>${esc(i.pref.text)}</span>${evPill(i.rel ? 'related' : 'aligned')}</div>${quoteHtml(i.quote || i.rel)}${i.rel ? '<div class="ri-f"><span>Related, not proof</span></div>' : ''}</div>`).join('') || none('Nothing stated yet.')}</section>
    <section class="rs"><div class="rs-h"><h2>First questions</h2>${fq.length ? '<button class="btn link" id="saveall">Save all</button>' : ''}</div>${shown.map((x, n) => { const saved = d.pocket.some(m => m.text === x.q); return `<div class="ri"><div class="ri-h"><span>${esc(x.q)}</span></div><div class="ri-f"><span>${esc(x.why)} · ${esc(x.pref.text)}</span><span class="btns"><button data-edq="${n}">Edit</button><button data-ask="${n}"${saved ? ' disabled' : ''}>${saved ? 'Saved' : 'Save'}</button></span></div></div>`; }).join('') || none('Nothing to ask yet.')}${fq.length > shown.length ? `<button class="btn link" id="moreq">${fq.length - shown.length} more</button>` : ''}</section>`}
    ${c.unsorted ? `<button class="btn link" id="uns">${c.unsorted} not sorted</button>` : ''}

      <button class="btn link" id="other">Try another</button></div>`,
    mount: r => {
      on(r, '#go', () => go('unfold', {}, 'replace'));
      on(r, '#pass', () => archiveDraft('Passed'));

      on(r, '#uns', () => go('mine'));
      on(r, '#bio', () => sheet(`<h3>${esc(p.name || 'Biodata')}</h3>${p.photo ? `<img class="bio-img" src="${p.photo}" alt="Attached image">` : ''}<div>${p.rows.map(x => `<div class="bd-row${x.hide ? ' hide' : ''}" style="color:var(--ink)"><b>${esc(x.k)}</b><span>${esc(x.v)}</span></div>`).join('')}</div><button class="btn primary" data-x>Close</button>`, (sh, close) => { $('[data-x]', sh).onclick = close; }));
      on(r, '[data-dis]', (e, b) => { const id = b.dataset.dis; d.dismissed[id] = !d.dismissed[id]; save(); render(); });
      on(r, '[data-ask]', (e, b) => { tuck(shown[+b.dataset.ask].q, 'pref'); save(); b.textContent = 'Saved'; b.disabled = true; toast('Saved'); });
      on(r, '[data-edq]', (e, b) => { const x = shown[+b.dataset.edq]; askText({title: 'Edit question', value: x.q, ok: 'Save'}, t => { if (t) { tuck(t, 'pref'); save(); toast('Saved'); render(); } }); });
      on(r, '#saveall', () => { fq.forEach(x => tuck(x.q, 'pref')); save(); toast('Saved'); render(); });
      on(r, '#moreq', () => { d.showAllQ = true; render(); });

};

/* ---------- onboarding ---------- */
const dots = i => `<div class="dots" aria-label="Step ${i + 1} of 6">${[0, 1, 2, 3, 4, 5].map(k => `<span class="d${k < i ? ' done' : k === i ? ' on' : ''}"></span>`).join('')}</div>`;

function prefSheet(pref, after) {
  const isNew = !pref;
  pref = pref || {id: uid(), text: '', theme: null, pol: 'pos', cat: null, src: [], checked: Date.now()};
  let cat = pref.cat;
  sheet(`<h3>${isNew ? 'Add a preference' : 'Edit'}</h3><textarea id="pt" placeholder="e.g. Openness to non-monogamy">${esc(pref.text)}</textarea>
  <div class="cats">${CATS.map(([k, l]) => `<button data-c="${k}" aria-pressed="${cat === k}">${l}</button>`).join('')}</div>
  ${pref.src.length ? `<p class="label">From your reflections</p>${pref.src.map(x => `<p class="srcq"><b>${QL[x.q] || ''}</b> “${esc(x.quote)}”</p>`).join('')}` : ''}
  <div class="row2"><button class="btn" data-rm>${isNew ? 'Cancel' : 'Delete'}</button><button class="btn primary" data-ok>Save</button></div>`, (sh, close) => {
    on(sh, '[data-c]', (e, b) => { cat = cat === b.dataset.c ? null : b.dataset.c; $$('[data-c]', sh).forEach(x => x.setAttribute('aria-pressed', x.dataset.c === cat)); });
    $('[data-ok]', sh).onclick = () => {

      if (t !== pref.text) { const th = detect(t); pref.theme = th ? th.id : null; pref.pol = polOf(th, t, cat === 'avoid' || cat === 'no' ? 'neg' : 'pos'); pref.text = t; }
      pref.cat = cat; pref.checked = Date.now();
      if (isNew) mine().push(pref);
      save(); close(); after ? after() : render();
    };
    $('[data-rm]', sh).onclick = () => { if (!isNew) S.mine = mine().filter(x => x !== pref); save(); close(); render(); };
  });
}
function catSheet() {
  sheet(`<h3>Categories</h3>${CATS.map(([, l, dsc]) => `<p><b style="color:var(--ink)">${l}</b><br>${dsc}</p>`).join('')}<button class="btn primary" data-x>Got it</button>`, (sh, close) => { $('[data-x]', sh).onclick = close; });

const prow = x => `<div class="prow"><button class="ptxt" data-id="${x.id}">${esc(x.text)}<small>${x.src.length ? esc(QL[x.src[0].q] || '') : 'Added by you'}</small></button><button class="x" data-del="${x.id}" aria-label="Delete">×</button></div>`;

const catButtons = x => `<div class="cats">${CATS.map(([k, l]) => `<button data-c="${k}" data-id="${x.id}" aria-pressed="${x.cat === k}">${l}</button>`).join('')}</div>`;

  <div class="actions"><button class="btn primary" id="done">Done</button></div>`,

SCENES.mine = (o) => {

  return {
    tone: 'sage', eyebrow: 'My preferences',
    html: `<h1 class="t">My preferences.</h1>
    ${pick ? `<div class="checkin"><p class="q">Does this still matter to you in the same way?</p><p class="pick">${esc(pick.text)} · ${CATL[pick.cat]}</p><div class="row3"><button class="btn" id="ck-y">Yes</button><button class="btn" id="ck-c">Change it</button><button class="btn" id="ck-n">Not now</button></div></div>` : ''}

  return {
    tone: 'pink', eyebrow: '02 Continue? · After',
    html: `<h1 class="t">So, what happened?</h1>
    <div class="nb-stage"><div class="nb" id="nb"><div class="inner"><span class="label" style="color:var(--paper-soft)">Encounter ${pad(b.pages.length + 1)}</span></div><div class="cover" id="cv" role="button" tabindex="0" aria-label="Open the scrapbook">${NOTEBOOK('#E9B9B3')}<span class="nb-label">${esc(b.name)}</span></div></div>

        nb.classList.add('open'); sfx('open'); buzz(10);
        const pg = {id: uid(), kind, date: Date.now(), fragments: defaultFragments(), tokens: [], revisits: {}, next: null, notes: []};
        b.pages.push(pg); S.ui.page = b.pages.length - 1; S.ui.q = 0; save();

};
const defaultFragments = () => [
  {id: uid(), prompt: 'What stuck with you?', text: '', who: 'them', x: .4, y: .2, r: -2, b: ''},

];

SCENES.fragments = (o) => {

  const bub = f => `<div class="bub ${f.who === 'me' ? 'me' : ''}${f.who === 'pause' ? ' pause' : ''}" data-id="${f.id}" tabindex="0" role="button" aria-label="${esc(f.text || f.prompt)}. Tap to write, arrow keys to move." style="left:${f.x * 100}%;top:${f.y * 100}%;--r:${f.r}deg;${f.b ? `--b:${f.b}` : ''}">${f.who === 'pause' && !f.text ? '<span class="pr">…a pause</span>' : f.text ? esc(f.text) : `<span class="pr">${esc(f.prompt)}</span>`}${f.text && f.prompt ? `<small>${esc(f.prompt)}</small>` : ''}</div>`;

    <div class="seg" id="who">${[['them', 'Them'], ['me', 'Me'], ['pause', 'Pause']].map(([k, l]) => `<button data-w="${k}" aria-pressed="${f.who === k}">${l}</button>`).join('')}</div>

SCENES.moments = (o) => {
  const b = bookById(o.book), pg = b && curPage(b); if (!pg) return SCENES.shelf();
  let sel = null;
  const tokHtml = (t, i) => `<button class="tok" data-id="${t.id}" aria-label="${esc(t.label)}${t.note ? ': ' + esc(t.note) : ''}. Tap to add a note, arrow keys to move." style="left:${t.x * 100}%;top:${t.y * 100}%;--r:${t.r}deg">${tokenSvg(t.type, i)}<span>${esc(t.label)}</span>${t.note ? '<i class="nt"></i>' : ''}</button>`;
  return {
    tone: 'pink', eyebrow: '02 Continue? · Moments',
    html: `<h1 class="t">How did it feel?</h1>
    <div class="page drop" id="mp" style="aspect-ratio:1/.82">${pg.tokens.map(tokHtml).join('')}</div>
    <div class="tray" id="tray">${Object.keys(TOKENS).map((k, i) => `<button data-t="${k}" aria-pressed="false">${tokenSvg(k, i)}${TOKENS[k].label}</button>`).join('')}</div>
    <p class="hint" id="mh">Drag a token onto the page</p>
    <div class="actions row2"><button class="btn primary" id="next">Next</button><button class="btn" id="skip">Skip</button></div>`,
    mount: r => {
      const mp = $('#mp', r), mh = $('#mh', r);
      let sel_label = '';
      const bindTok = el => {
        const t = pg.tokens.find(x => x.id === el.dataset.id);
        drag(el, {stage: mp, min: .08, max: .92, get: () => t, set: (x, y) => { t.x = x; t.y = y; place(el, x, y); }, end: save,
          tap: () => askText({title: t.label, value: t.note || '', placeholder: 'Add a note', ok: 'Save', remove: () => { pg.tokens = pg.tokens.filter(x => x !== t); save(); render(); }}, txt => { t.note = txt; save(); render(); })});
      };
      $$('.tok', r).forEach(bindTok);
      const addTok = (type, x, y, label) => {
        const t = {id: uid(), type, label: label || TOKENS[type].label, note: '', x, y, r: Math.round(rnd() * 16 - 8)};
        pg.tokens.push(t); save();
        $('.empty', mp)?.remove();
        mp.insertAdjacentHTML('beforeend', tokHtml(t, pg.tokens.length - 1));
        const el = mp.lastElementChild; bindTok(el); sfx('drop'); buzz(6);
        return el;
      };
      const choose = (type, then) => {
        if (type !== 'custom') return then(TOKENS[type].label);
        askText({title: 'Your own', placeholder: 'e.g. the walk back', ok: 'Add'}, t => { if (t) then(t.slice(0, 22)); });
      };
      $$('#tray button', r).forEach(btn => {
        const type = btn.dataset.t; let pid = null, sx = 0, sy = 0, ghost = null;
        btn.addEventListener('pointerdown', e => { pid = e.pointerId; sx = e.clientX; sy = e.clientY; try { btn.setPointerCapture(pid); } catch (_) {} });
        btn.addEventListener('pointermove', e => {
          if (e.pointerId !== pid) return;
          if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 8 && type !== 'custom') {
            ghost = document.createElement('div'); ghost.className = 'tok lifted'; ghost.style.position = 'fixed'; ghost.style.zIndex = 40; ghost.style.pointerEvents = 'none';
            ghost.innerHTML = tokenSvg(type) + `<span>${TOKENS[type].label}</span>`; document.body.append(ghost); sfx('lift');
          }
          if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
        });
        const up = e => {
          if (e.pointerId !== pid) return; pid = null;
          if (ghost) {
            ghost.remove(); ghost = null;
            if (over(e, mp)) { const rc = mp.getBoundingClientRect(); addTok(type, clamp((e.clientX - rc.left) / rc.width, .08, .92), clamp((e.clientY - rc.top) / rc.height, .08, .92)); }
            return;
          }
          if (e.type !== 'pointerup') return;
          const was = sel === type;
          $$('#tray button', r).forEach(x => x.setAttribute('aria-pressed', 'false'));
          if (was) { sel = null; mh.textContent = 'Drag a token onto the page'; return; }
          choose(type, label => { sel = type; sel_label = label; btn.setAttribute('aria-pressed', 'true'); mh.textContent = 'Tap the page'; });
        };
        btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up);
        btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(type, label => { addTok(type, .2 + rnd() * .6, .2 + rnd() * .6, label); say(label + ' placed'); }); } });
      });
      mp.addEventListener('click', e => {
        if (!sel || e.target.closest('.tok')) return;
        const rc = mp.getBoundingClientRect();
        addTok(sel, clamp((e.clientX - rc.left) / rc.width, .08, .92), clamp((e.clientY - rc.top) / rc.height, .08, .92), sel_label);
        sel = null; $$('#tray button', r).forEach(x => x.setAttribute('aria-pressed', 'false')); mh.textContent = 'Tap it to add a note';
      });
      on(r, '#next', () => { S.ui.q = 0; go('thennow', {book: b.id}); });
      on(r, '#skip', () => { S.ui.q = 0; go('thennow', {book: b.id}); });
    }
  };
};

SCENES.thennow = (o) => {

  };

    <div class="tn"><div><p class="label w" style="margin-bottom:8px">Then</p><div class="note-w"><div class="note" style="font-size:16px">${esc(q.text)}${q.history.length ? `<small>revised ${q.history.length}×</small>` : ''}</div></div></div>
    <div><p class="label" style="margin-bottom:8px">Now</p><div class="exp">${rv.note ? esc(rv.note) : rv.open ? '<span class="ph">Skipped</span>' : '<span class="ph">…</span>'}</div></div></div>
    ${earlier.length ? `<div class="trail"><span class="label">Before</span>${earlier.map(x => `<span><b>Encounter ${pad(x.i + 1)}:</b> ${esc(x.v.note)}</span>`).join('')}</div>` : ''}
    ${qs.length > 1 ? `<p class="hint">${qi + 1} of ${qs.length}</p>` : ''}
    <div class="actions"><div class="row2"><button class="btn" id="obs">Add a note</button><button class="btn" id="rev">Edit question</button></div>
    <div class="row2"><button class="btn" id="open">Skip</button><button class="btn primary" id="next">Next</button></div></div>`,
    mount: r => {
      on(r, '#obs', () => askText({title: q.text, value: rv.note || '', placeholder: 'What happened?', ok: 'Save'}, t => { pg.revisits[q.id] = {note: t, open: !t}; save(); render(); }));
      on(r, '#rev', () => askText({title: 'Edit question', value: q.text, ok: 'Save'}, t => { if (t && t !== q.text) { q.history.push({text: q.text, page: pIdx}); q.text = t; save(); render(); } }));
      on(r, '#open', () => { pg.revisits[q.id] = {note: '', open: true}; save(); advance(); });
      on(r, '#next', advance);
      function advance() { if (qi < qs.length - 1) { S.ui.q = qi + 1; render(); } else { S.ui.m = 0; go('matters', {book: b.id}); } }

};

SCENES.matters = (o) => {

    ${pg.next?.text ? `<p class="sec">${pg.next.type === 'question' ? 'Next time' : 'Memory'}</p><div class="items"><button class="it q" data-next>${esc(pg.next.text)}</button></div>` : ''}

    : tab === 'time' ? `<h2 class="pg-h">Over time</h2>
      <div class="evo">${b.questions.map(q => `<div>${q.history.map(h => `<s>${esc(h.text)}</s>`).join('')}<div class="q">${esc(q.text)}</div><ul>${b.pages.map((p, i) => p.revisits[q.id] ? `<li><b>Encounter ${pad(i + 1)}:</b> ${p.revisits[q.id].note ? esc(p.revisits[q.id].note) : 'skipped'}</li>` : '').join('') || '<li>—</li>'}</ul></div>`).join('') || '<p class="pg-m">No questions yet.</p>'}</div>`

        sheet(`<h3>${esc(label)}</h3>${kind !== 'notes' ? `<textarea id="nt" placeholder="${kind === 'tokens' ? 'Add a note' : 'Words'}">${esc(kind === 'tokens' ? item.note || '' : item.text)}</textarea>` : `<textarea id="nt">${esc(item.text)}</textarea>`}
          ${others.length ? `<p>Move to</p><div class="seg">${others.map(x => `<button data-mv="${x.i}">Encounter ${pad(x.i + 1)}</button>`).join('')}</div>` : ''}
          <div class="row2"><button class="btn" data-rm>Remove</button><button class="btn primary" data-ok>Save</button></div>`, (sh, close) => {
          $('[data-ok]', sh).onclick = () => { const v = $('#nt', sh).value.trim(); if (kind === 'tokens') item.note = v; else item.text = v; save(); close(); render(); };
          $('[data-rm]', sh).onclick = () => { pg[kind] = pg[kind].filter(x => x !== item); save(); close(); render(); };
          on(sh, '[data-mv]', (e2, m) => { const to = b.pages[+m.dataset.mv]; pg[kind] = pg[kind].filter(x => x !== item); to[kind].push(item); save(); close(); toast('Moved'); render(); });
        });
      });
    }
  };
};

/* ---------- example book for a first look ---------- */
function exampleBook() {
  const p = parseBiodata(SAMPLE), book = p.objects.find(x => x.kind === 'book'), fam = p.objects.find(x => x.kind === 'photo');
  const q1 = {id: uid(), text: 'What has he read recently that he couldn’t put down?', history: [{text: 'What would you want to ask about something they’ve read recently?', page: 0}], obj: {kind: 'book', title: book.title, about: book.about, known: book.known}};
  const q2 = {id: uid(), text: 'What makes them laugh?', history: [], obj: null};
  const q3 = {id: uid(), text: 'Which family tradition would they keep?', history: [], obj: {kind: 'photo', title: fam.title, about: fam.about, known: fam.known}};
  const day = 864e5, now = Date.now();
  const pg = (kind, ago, frags, toks, rev, next) => ({id: uid(), kind, date: now - ago * day, fragments: frags.map((f, i) => ({id: uid(), prompt: '', text: f[0], who: f[1], x: .45 + (i % 2) * .1, y: .2 + i * .3, r: i % 2 ? 2 : -2, b: ''})), tokens: toks.map((t, i) => ({id: uid(), type: t[0], label: TOKENS[t[0]].label, note: t[1] || '', x: .2 + i * .25, y: .35 + (i % 2) * .3, r: 0})), revisits: rev, next, notes: []});
  return {id: uid(), name: 'Rohan', example: true, created: now - 20 * day, status: 'unfinished', questions: [q1, q2, q3], pages: [
    pg('A call', 14, [['I’ve been rereading the same three books since college.', 'them'], ['A long pause after I asked about Bengaluru.', 'pause']], [['curiosity', 'When he talked about the books'], ['silence'], ['uncertainty', 'Whether the pause meant anything']], {[q1.id]: {note: 'He mentioned rereading old favourites more than finding new ones.'}, [q2.id]: {note: '', open: true}}, {type: 'question', text: 'What keeps him going back to the same books?'}),
    pg('A conversation', 5, [['My sister would like you.', 'them'], ['I laughed harder than I expected to.', 'me']], [['laughter', 'The story about the football trophy'], ['surprise'], ['affection']], {[q2.id]: {note: 'A badly told story about a football trophy. Mostly the telling.'}, [q3.id]: {note: 'Sunday lunches at his parents’. He said it without being asked.'}}, {type: 'memory', text: 'Walking out and both of us forgetting which way the car was.'})
  ]};
}

/* ---------- settings + privacy ---------- */
function openSettings() {
  const st = S.settings;
  sheet(`<h3>Settings</h3>
  <label class="tog"><span>Reduced motion</span><input type="checkbox" class="sw" id="s-rm" ${st.reduced ? 'checked' : ''}></label>
  <label class="tog"><span>Paper sounds</span><input type="checkbox" class="sw" id="s-snd" ${st.sound ? 'checked' : ''}></label>
  <label class="tog"><span>Haptics</span><input type="checkbox" class="sw" id="s-hap" ${st.haptics ? 'checked' : ''}></label>
  <p>Saved only in this browser. Contact details are never kept.</p>
  ${S.archived.length ? `<p class="label">Archived</p>${S.archived.map(a => `<div class="arch"><span>${esc(a.name)} · ${new Date(a.at).toLocaleDateString()}</span><span class="seg"><button data-ro="${a.id}">Reopen</button><button data-da="${a.id}">Delete</button></span></div>`).join('')}` : ''}
  ${S.books.length ? `<p class="label">Scrapbooks</p>${S.books.map(b => `<div class="arch"><span>${esc(b.name)} · ${b.pages.length} page${b.pages.length === 1 ? '' : 's'}</span><span class="seg"><button data-db="${b.id}">Delete</button></span></div>`).join('')}` : ''}
  <button class="btn" id="s-f">My preferences</button>
  <div class="row2"><button class="btn" id="s-all">Delete everything</button><button class="btn primary" data-x>Done</button></div>`, (sh, close) => {
    $('#s-rm', sh).onchange = e => { st.reduced = e.target.checked; applyMotion(); save(); };
    $('#s-snd', sh).onchange = e => { st.sound = e.target.checked; save(); if (st.sound) sfx('page'); };
    $('#s-hap', sh).onchange = e => { st.haptics = e.target.checked; save(); buzz(10); };
    $('[data-x]', sh).onclick = close;
    $('#s-f', sh).onclick = () => { close(); go(onb().done && mine().length ? 'mine' : 'onb'); };
    on(sh, '[data-ro]', (e, x) => { const a = S.archived.find(y => y.id === x.dataset.ro); if (S.draft && S.draft.profile) { toast('Finish the current profile first'); return; } S.draft = a.draft; S.archived = S.archived.filter(y => y !== a); save(); close(); go('table'); });
    on(sh, '[data-da]', (e, x) => { S.archived = S.archived.filter(y => y.id !== x.dataset.da); save(); x.closest('.arch').remove(); toast('Deleted'); });
    on(sh, '[data-db]', (e, x) => { const b = bookById(x.dataset.db); close(); confirmSheet(`Delete ${esc(b.name)}?`, 'This can’t be undone.', 'Delete', () => { S.books = S.books.filter(y => y !== b); save(); toast('Deleted'); go('shelf', {}, 'reset'); }); });
    $('#s-all', sh).onclick = () => { close(); confirmSheet('Delete everything?', 'This can’t be undone.', 'Delete', () => { const keep = S.settings; S = fresh(); S.settings = keep; try { localStorage.removeItem(KEY); } catch (e) {} save(); toast('Deleted'); go('title', {}, 'reset'); }); };
  });
}

render();
})();
</script>
