<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot Twist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column; each scene = eyebrow bar, serif headline, a tactile stage, quiet paper buttons. Chapter One lives on butter, Chapter Two on dusty pink, the in-between on sage. */
:root{
  --butter-bg:#F7EDCB; --cream-bg:#FBF6EC; --sage-bg:#E2E8D9; --pink-bg:#F1DDD6; --blue-bg:#DEE8EF;
  --ink:#3D3431; --ink-soft:#73665F; --line:rgba(61,52,49,.18);
  --paper:#FFFCF5; --paper-ink:#3D3431; --edge:rgba(61,52,49,.26); --paper-soft:#7A6D66;
  --coral:#C65A43; --coral-ink:#FFF8F0;
  --n-butter:#F3E2A6; --n-pink:#EDC3BC; --n-blue:#CFDDE8; --n-sage:#C3D3B8; --n-cream:#FFFCF5;
  --table:#FBF4E2; --table-edge:rgba(61,52,49,.14);
  --shadow:rgba(61,52,49,.16);
  --serif:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --stamp-ok:#4F6B45; --stamp-flag:#B4462F;
  --bg:var(--butter-bg);
}
/* palettes: light values first, then dark. data-mode (light/dark) overrides the viewer theme; none follows it. */
:root[data-pal="lagoon"]{--butter-bg:#E2EEEF; --cream-bg:#F2F7F6; --sage-bg:#DCEBE3; --pink-bg:#E5E8F4; --blue-bg:#DAE7F1; --ink:#22363A; --ink-soft:#5B7276; --line:rgba(34,54,58,.18); --coral:#2C7C84; --n-butter:#F4E4A4; --n-pink:#F2C8BF; --n-blue:#BCD8E6; --n-sage:#BEDFCE; --table:#EEF5F3; --stamp-ok:#2F6E55; --stamp-flag:#B4462F; --shadow:rgba(34,54,58,.16)}
:root[data-pal="plum"]{--butter-bg:#F3E5EE; --cream-bg:#FAF3F6; --sage-bg:#ECE6F3; --pink-bg:#F6DFE3; --blue-bg:#E6E2F2; --ink:#3A2836; --ink-soft:#7A6375; --line:rgba(58,40,54,.18); --coral:#7D3F7B; --n-butter:#F6D88A; --n-pink:#F1C3D1; --n-blue:#D2CCEB; --n-sage:#CDE0C5; --table:#F8EEF4; --stamp-ok:#4F6B45; --stamp-flag:#A8364F; --shadow:rgba(58,40,54,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode="light"]){--butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B; --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2); --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4); --coral:#D86A50; --stamp-ok:#A7C59A; --stamp-flag:#EE937C; color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]){--butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B; --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2); --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4); --coral:#D86A50; --stamp-ok:#A7C59A; --stamp-flag:#EE937C; color-scheme:dark}
:root[data-mode="dark"]{--butter-bg:#2B261B; --cream-bg:#27231E; --sage-bg:#212720; --pink-bg:#2D2224; --blue-bg:#1F252B; --ink:#F2E9DA; --ink-soft:#C3B6A8; --line:rgba(242,233,218,.2); --table:#3A3328; --table-edge:rgba(242,233,218,.12); --shadow:rgba(0,0,0,.4); --coral:#D86A50; --stamp-ok:#A7C59A; --stamp-flag:#EE937C; color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-pal="lagoon"]:not([data-theme="light"]):not([data-mode="light"]){--butter-bg:#16272A; --cream-bg:#172225; --sage-bg:#152620; --pink-bg:#1C1F2E; --blue-bg:#162129; --ink:#E4F1EF; --ink-soft:#A6C0BF; --line:rgba(228,241,239,.2); --coral:#5DB4BC; --coral-ink:#10292C; --table:#203538; --table-edge:rgba(228,241,239,.12); --stamp-ok:#8FD1B0; --stamp-flag:#F09A86; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-pal="lagoon"][data-theme="dark"]:not([data-mode="light"]){--butter-bg:#16272A; --cream-bg:#172225; --sage-bg:#152620; --pink-bg:#1C1F2E; --blue-bg:#162129; --ink:#E4F1EF; --ink-soft:#A6C0BF; --line:rgba(228,241,239,.2); --coral:#5DB4BC; --coral-ink:#10292C; --table:#203538; --table-edge:rgba(228,241,239,.12); --stamp-ok:#8FD1B0; --stamp-flag:#F09A86; --shadow:rgba(0,0,0,.45); color-scheme:dark}
:root[data-pal="lagoon"][data-mode="dark"]{--butter-bg:#16272A; --cream-bg:#172225; --sage-bg:#152620; --pink-bg:#1C1F2E; --blue-bg:#162129; --ink:#E4F1EF; --ink-soft:#A6C0BF; --line:rgba(228,241,239,.2); --coral:#5DB4BC; --coral-ink:#10292C; --table:#203538; --table-edge:rgba(228,241,239,.12); --stamp-ok:#8FD1B0; --stamp-flag:#F09A86; --shadow:rgba(0,0,0,.45); color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-pal="plum"]:not([data-theme="light"]):not([data-mode="light"]){--butter-bg:#291D27; --cream-bg:#241B23; --sage-bg:#231E2B; --pink-bg:#2B1D23; --blue-bg:#211E2C; --ink:#F3E7EF; --ink-soft:#C5B1C0; --line:rgba(243,231,239,.2); --coral:#CF8FCB; --coral-ink:#2A1027; --table:#382A35; --table-edge:rgba(243,231,239,.12); --stamp-ok:#B5D3A4; --stamp-flag:#F29AAE; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-pal="plum"][data-theme="dark"]:not([data-mode="light"]){--butter-bg:#291D27; --cream-bg:#241B23; --sage-bg:#231E2B; --pink-bg:#2B1D23; --blue-bg:#211E2C; --ink:#F3E7EF; --ink-soft:#C5B1C0; --line:rgba(243,231,239,.2); --coral:#CF8FCB; --coral-ink:#2A1027; --table:#382A35; --table-edge:rgba(243,231,239,.12); --stamp-ok:#B5D3A4; --stamp-flag:#F29AAE; --shadow:rgba(0,0,0,.45); color-scheme:dark}
:root[data-pal="plum"][data-mode="dark"]{--butter-bg:#291D27; --cream-bg:#241B23; --sage-bg:#231E2B; --pink-bg:#2B1D23; --blue-bg:#211E2C; --ink:#F3E7EF; --ink-soft:#C5B1C0; --line:rgba(243,231,239,.2); --coral:#CF8FCB; --coral-ink:#2A1027; --table:#382A35; --table-edge:rgba(243,231,239,.12); --stamp-ok:#B5D3A4; --stamp-flag:#F29AAE; --shadow:rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .6s ease;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
body[data-tone=butter]{--bg:var(--butter-bg)}
body[data-tone=cream]{--bg:var(--cream-bg)}
body[data-tone=sage]{--bg:var(--sage-bg)}
body[data-tone=pink]{--bg:var(--pink-bg)}
body[data-tone=blue]{--bg:var(--blue-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:3px;border-radius:6px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.bar{display:flex;align-items:center;gap:10px;min-height:46px}
.eyebrow{flex:1;font:800 9.5px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.icon-btn{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px var(--shadow)}
.icon-btn.back{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.scene{flex:1;display:flex;flex-direction:column;gap:14px;animation:sceneIn .55s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.t{font:400 clamp(28px,8.4vw,35px)/1.08 var(--serif);letter-spacing:-.015em;margin:12px 0 0;text-wrap:balance;outline:none}
.sub{color:var(--ink-soft);margin:-4px 0 0;font-size:13.5px;line-height:1.45;max-width:36ch}
.label{font:800 9.5px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.label.w{color:var(--coral)}
.hint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:0;line-height:1.5}
.actions{display:grid;gap:8px;margin-top:auto;padding-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 13.5px/1.2 var(--sans);border-radius:8px;padding:13px 14px;border:1px solid var(--line);background:var(--paper);color:var(--paper-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--spring),box-shadow .2s;box-shadow:0 1px 2px var(--shadow);text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--coral);color:var(--coral-ink);border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.btn.link{background:none;border:0;box-shadow:none;color:var(--ink-soft);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);padding-top:16px}
.foot svg{width:11px;height:11px}
.ill{display:block;width:100%;height:100%;overflow:visible;filter:url(#wobble)}

/* paper notes */
.note-w{filter:drop-shadow(0 3px 5px var(--shadow));transition:transform .35s var(--spring)}
.note{--n:var(--n-butter);position:relative;background:var(--n);color:var(--paper-ink);font:400 18px/1.18 var(--serif);padding:16px 26px 18px 16px;border:1.3px solid var(--edge);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.note::after{content:"";position:absolute;top:-1px;right:-1px;width:21px;height:21px;background:linear-gradient(225deg,transparent 48%,var(--edge) 48% 54%,rgba(0,0,0,.08) 54%)}
.note small{display:block;font:700 9.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:8px}
.note.pink{--n:var(--n-pink)} .note.blue{--n:var(--n-blue)} .note.sage{--n:var(--n-sage)} .note.cream{--n:var(--n-cream)}
.tape{position:absolute;width:46px;height:14px;background:rgba(243,226,166,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);transform:rotate(-4deg)}

/* hero illustrations */
.hero{position:relative;height:250px;margin:4px 0;pointer-events:none}
.hero .env,.chapter .env{touch-action:auto}
.page .empty{color:var(--paper-soft)}
.mini-known .label{color:var(--paper-soft)}
.nb .cover{backface-visibility:hidden}
.hero > *{position:absolute}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(var(--r,0deg))}}
.squiggle{width:136px;height:14px;color:var(--coral);margin-top:-2px;overflow:visible}
.squiggle path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s ease-out .2s forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
html.rm .squiggle path{stroke-dashoffset:0}
.display{font:400 clamp(54px,17vw,72px)/.92 var(--serif);letter-spacing:-.03em;margin:22px 0 0;outline:none}
.lede{font-size:15px;margin:0}
.card-btn{display:block;text-align:left;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;font-size:11px;line-height:1.5;box-shadow:0 1px 2px var(--shadow)}
.card-btn b{font-size:11.5px;display:block}
.card-btn span{color:var(--paper-soft)}

/* chapter select */
.chapter{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;color:var(--ink)}
.chapter.flip{grid-template-columns:110px 1fr}
.chapter h2{font:400 22px/1.15 var(--serif);margin:0 0 6px}
.chapter p{margin:0;font-size:13px;color:var(--ink-soft)}
.chapter .pic{height:110px;transition:transform .4s var(--spring)}
.chapter:hover .pic,.chapter:focus-visible .pic{transform:rotate(-3deg) translateY(-3px)}
.dash{border:0;border-top:1.5px dashed var(--line);margin:4px 0;width:100%}

/* envelope */
.env{position:relative;width:min(100%,320px);aspect-ratio:3/2;margin:14px auto 0;perspective:900px;touch-action:none}
.env > *{position:absolute;left:0;width:100%}
.env-body{top:0;height:100%;z-index:1}
.env-paper{left:7%;width:86%;top:8%;height:84%;z-index:2;background:var(--paper);border:1.3px solid var(--edge);border-radius:2px;transition:transform .8s var(--spring);padding:12px 14px;color:var(--paper-ink);font:400 13px/1.3 var(--serif)}
.env-paper i{display:block;height:5px;margin:7px 0;background:rgba(61,52,49,.12);border-radius:3px}
.env-front{top:0;height:100%;z-index:3;pointer-events:none}
.env-flap{top:0;height:62%;z-index:4;transform-origin:50% 0;transition:transform .7s var(--spring);transform-style:preserve-3d;cursor:grab}
.env-flap.dragging{transition:none}
.env.open .env-flap{transform:rotateX(178deg);z-index:0}
.env.open .env-paper{transform:translateY(-58%)}
.pull{position:absolute;right:10%;top:-4%;background:var(--n-butter);border:1.3px solid var(--edge);color:var(--paper-ink);font:600 11px var(--serif);padding:4px 9px;transform:rotate(-8deg);z-index:5;pointer-events:none}
.env-label{position:absolute;left:30%;top:56%;z-index:3;background:var(--paper);border:1.3px solid var(--edge);color:var(--paper-ink);padding:6px 10px;font:600 11px/1.25 var(--sans);transform:rotate(-2deg);pointer-events:none}
.env-arc{position:absolute;right:-2%;top:-22%;width:60px;height:70px;color:var(--coral);z-index:6;pointer-events:none}

/* biodata paper */
.fold{position:relative;width:min(100%,330px);margin:6px auto 0;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);box-shadow:0 8px 18px -8px var(--shadow);transform:rotate(-1.2deg);touch-action:pan-y;cursor:pointer}
.panel{padding:12px 18px;overflow:hidden;transform-origin:50% 0;transition:max-height .65s var(--spring),transform .65s var(--spring),opacity .4s,padding .4s;max-height:420px}
.panel + .panel{border-top:1.2px dashed rgba(61,52,49,.3)}
.panel.shut{max-height:0;opacity:.2;transform:perspective(600px) rotateX(-85deg);padding-block:0}
.bd-om{text-align:center;font:600 10px/1.2 var(--sans);letter-spacing:.14em;color:var(--coral);margin:2px 0 4px}
.bd-title{text-align:center;font:600 20px/1.1 var(--serif);letter-spacing:.18em;margin:0 0 8px}
.bd-row{display:grid;grid-template-columns:42% 1fr;gap:8px;font-size:11.5px;line-height:1.35;padding:2.5px 0;border-bottom:1px dotted rgba(61,52,49,.18)}
.bd-row b{font-weight:700;color:var(--paper-soft)}
.bd-row.hide span{font-style:italic;color:var(--paper-soft)}
.bd-empty{font:400 26px/1.15 var(--serif);padding:22px 4px 26px}
.fold .tape{left:42%;top:-8px}

/* tabletop */
.tabletop{position:relative;width:100%;background:var(--table);border:1px solid var(--table-edge);border-radius:6px;box-shadow:inset 0 0 40px rgba(120,90,40,.06),0 10px 24px -14px var(--shadow);overflow:hidden}
.obj{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;transition:left .7s var(--spring),top .7s var(--spring),transform .35s var(--spring),opacity .4s,filter .2s;filter:drop-shadow(0 3px 2px var(--shadow));z-index:2}
.obj.lifted{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.14);filter:drop-shadow(0 12px 10px var(--shadow));z-index:20;transition:transform .3s var(--spring),filter .2s;cursor:grabbing}
.obj.packed{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.obj.seen::after{content:"";position:absolute;right:4px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--coral);opacity:.55}
.pocket{position:absolute;width:78px;height:72px;background:none;border:0;padding:0;cursor:pointer;z-index:3;transition:transform .35s var(--spring)}
.pocket.hot{transform:scale(1.12) rotate(-3deg)}
.pocket .cnt{position:absolute;left:0;right:0;top:44%;text-align:center;font:700 10px var(--sans);color:#2f3a2c}
.space{position:absolute;transform:translate(-50%,-50%);border:1.6px dashed var(--ink-soft);border-radius:40% 55% 45% 50%;width:72px;height:64px;display:grid;place-items:center;color:var(--ink-soft);background:none;cursor:pointer;font:400 22px var(--serif);animation:fadeIn 1s ease both;z-index:1}
@keyframes fadeIn{from{opacity:0}}
.source{position:absolute;left:8%;top:10%;width:46%;transform:rotate(-3deg);background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);padding:12px;font:400 15px/1.2 var(--serif);cursor:pointer}
.source small{display:block;font:800 8.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;color:var(--paper-soft)}

/* inspect */
.inspect{display:grid;grid-template-columns:1fr;gap:10px}
.big:focus-visible{outline-offset:8px}
.wrow .note-w{transition:transform .35s var(--spring),opacity .2s}
.big{width:150px;height:150px;margin:2px auto 0;transform:rotate(var(--r,0deg));transition:transform .5s var(--spring);touch-action:none;cursor:grab;filter:drop-shadow(0 10px 8px var(--shadow))}
.big.dragging{transition:none}
.rot{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.rot .icon-btn{width:34px;height:34px}
.known{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.known ul{margin:6px 0 0;padding-left:16px}
.known .label{color:var(--paper-soft)}
.wrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:end}
.wrow .note-w{touch-action:none;cursor:grab;transform:rotate(-2deg)}
.wrow .note-w.lifted{transform:rotate(-5deg) scale(1.04)}
.wrow .pocket{position:relative;width:84px;height:78px}

/* boards */
.board{position:relative;width:100%;aspect-ratio:1/1.12;max-width:100%;border-radius:6px;background:color-mix(in srgb,var(--n-sage) 35%,var(--table));border:1px solid var(--table-edge);overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(56%,190px);touch-action:none;cursor:grab;z-index:2;transition:left .5s var(--spring),top .5s var(--spring)}
.pin.lifted{z-index:20;transition:none}
.pin .note{font-size:15.5px;padding:12px 22px 14px 12px}
.pin::before{content:"";position:absolute;left:50%;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral);z-index:3;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--ink-soft);font:400 16px/1.35 var(--serif)}

/* empty spaces scene */
.sil-wrap{display:grid;gap:14px;padding:4px 2px}
.sil{border:1.6px dashed var(--ink-soft);background:transparent;color:var(--ink);text-align:left;font:400 17px/1.22 var(--serif);padding:16px 18px;cursor:pointer;transition:background .4s,transform .4s var(--spring),border-color .3s;width:86%}
.sil:nth-child(odd){border-radius:22px 6px 26px 8px;transform:rotate(-1.5deg)}
.sil:nth-child(even){justify-self:end;border-radius:6px 26px 8px 24px;transform:rotate(1.5deg)}
.sil.kept{border-style:solid;border-color:var(--paper-ink);background:var(--n-blue);color:var(--paper-ink)}
.sil.kept:nth-child(3n){background:var(--n-pink)} .sil.kept:nth-child(3n+1){background:var(--n-butter)}
.sil small{display:block;font:700 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;opacity:.65}

/* keepsake box */
.boxstage{position:relative;height:250px}
.boxstage .box{position:absolute;left:50%;bottom:6px;width:230px;height:160px;transform:translateX(-50%)}
.kbox .lid,.box .lid{position:absolute;left:0;top:-6px;width:100%;transform-origin:50% 100%;transition:transform .8s var(--spring)}
.boxstage.closed .lid{transform:translateY(52px) scaleY(.9)}
.boxstage .note-w{position:absolute;left:50%;top:8px;width:200px;transform:translateX(-50%) rotate(-7deg);transition:transform .7s var(--spring),opacity .5s}
.boxstage.closed .note-w{transform:translateX(-50%) translateY(120px) scale(.5);opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1.25 var(--serif);border:1.2px solid var(--line);background:var(--paper);color:var(--paper-ink);padding:7px 10px;border-radius:3px;cursor:pointer;text-align:left;transition:transform .3s var(--spring),background .2s,opacity .2s}
.chip[aria-pressed=true]{background:var(--n-sage);border-color:var(--paper-ink)}
.chip[aria-pressed=false]{opacity:.65;text-decoration:line-through;text-decoration-color:rgba(61,52,49,.35)}
.field{display:grid;gap:6px}
.field input,.field textarea,.sheet textarea,.sheet input:not([type=checkbox]){font:400 16px/1.35 var(--serif);border:1.2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);color:var(--paper-ink);width:100%}
.field label{font:800 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

/* scrapbook shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;padding-top:4px}
.bk{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:center;font-size:11px}
.bk .cover{position:relative;aspect-ratio:4/5;margin-bottom:6px;transition:transform .45s var(--spring)}
.bk:hover .cover,.bk:focus-visible .cover{transform:rotate(-2.5deg) translateY(-3px)}
.bk .name{position:absolute;left:24%;right:10%;top:22%;background:var(--paper);color:var(--paper-ink);border:1.2px solid var(--edge);font:400 17px/1.1 var(--serif);padding:10px 4px;overflow-wrap:anywhere}
.bk .st{display:block;color:var(--ink-soft)}

/* notebook stage (part two) */
.nb-stage{position:relative;height:300px}
.nb{position:absolute;left:12%;top:0;width:66%;height:94%;perspective:1100px}
.nb .cover{position:absolute;inset:0;transform-origin:0 50%;transition:transform .9s var(--spring);z-index:2;cursor:pointer;touch-action:none}
.nb .inner{position:absolute;inset:3% 2% 3% 4%;background:var(--paper);border:1.3px solid var(--edge);z-index:1;padding:18px;color:var(--paper-ink);font:400 16px/1.3 var(--serif)}
.nb.open .cover{transform:rotateY(-160deg)}
.nb-label{position:absolute;left:26%;top:28%;width:58%;background:var(--paper);border:1.3px solid var(--edge);color:var(--paper-ink);padding:12px;font:400 17px/1.2 var(--serif)}
.kbox{position:absolute;right:0;bottom:2%;width:118px;height:86px}
.kind-row{display:flex;flex-wrap:wrap;gap:6px}

/* scrapbook page */
.page{position:relative;width:100%;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);box-shadow:5px 6px 0 -1px var(--n-pink),5px 6px 0 0 var(--edge),0 12px 22px -12px var(--shadow);overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 27px,rgba(61,52,49,.07) 27px 28px)}
.page.drop{aspect-ratio:1/1.08}
.bub{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(64%,220px);background:var(--b,var(--paper));border:1.3px solid var(--edge);padding:10px 12px 12px;font:400 16px/1.2 var(--serif);color:var(--paper-ink);touch-action:none;cursor:grab;filter:drop-shadow(0 3px 3px var(--shadow));z-index:2;transition:transform .35s var(--spring)}
.bub::after{content:"";position:absolute;bottom:-9px;left:20px;width:15px;height:15px;background:var(--b,var(--paper));border-right:1.3px solid var(--edge);border-bottom:1.3px solid var(--edge);transform:rotate(45deg) skew(10deg,10deg)}
.bub.me::after{left:auto;right:20px}
.bub.pause{border-style:dashed;background:transparent;filter:none}
.bub.pause::after{display:none}
.bub .pr{color:var(--paper-soft);font-size:15px}
.bub small{display:block;font:700 8.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);margin-top:6px}
.bub.lifted{z-index:20;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.05)}
.tok{position:absolute;width:58px;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:none;border:0;padding:0;cursor:grab;touch-action:none;color:var(--paper-ink);text-align:center;z-index:2;transition:transform .35s var(--spring)}
.tok svg{width:54px;height:54px;display:block;margin:0 auto;filter:drop-shadow(0 3px 2px var(--shadow))}
.tok span{font:600 10px/1.1 var(--serif);display:block;margin-top:1px}
.tok.lifted{z-index:20;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.15)}
.tok .nt{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.tray button{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--paper-ink);border-radius:8px;touch-action:none;font:600 10px var(--serif)}
.tray button svg{width:40px;height:40px;display:block;margin:0 auto 2px}
.tray button[aria-pressed=true]{background:var(--n-butter);outline:1.2px solid var(--edge)}

/* then & now */
.tn{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.tn .note-w:first-child{transform:rotate(-2deg)}
.exp{background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);padding:14px 12px;font:400 17px/1.2 var(--serif);transform:rotate(1.5deg);min-height:140px;box-shadow:0 6px 12px -8px var(--shadow)}
.exp .ph{color:var(--paper-soft)}
.exp small{display:block;font:400 11px/1.35 var(--sans);color:var(--paper-soft);margin-top:10px}
.mini-known{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--paper-ink);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:12px}
.mini-known .ic{width:38px;height:38px;flex:none}
.trail{display:grid;gap:4px;font-size:12px;color:var(--ink-soft)}
.trail b{color:var(--ink);font-weight:700}

/* next page */
.np{position:relative;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);padding:18px 18px 18px 30px;box-shadow:0 10px 20px -12px var(--shadow)}
.np::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:8px;background:radial-gradient(circle at 4px 6px,transparent 3px,var(--paper-ink) 3.4px,transparent 4.4px) 0 0/8px 30px repeat-y}
.np button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px dotted rgba(61,52,49,.2);padding:11px 0;font:400 17px var(--serif);color:var(--paper-ink);cursor:pointer;text-align:left}
.np button svg{width:16px;height:16px}
.np .written{font:400 18px/1.3 var(--serif);padding:8px 0 4px;white-space:pre-wrap}
.np .written small{display:block;font:800 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-soft);margin-bottom:4px}
.motto{text-align:center;font:400 15px/1.35 var(--serif);margin:4px 0 0;text-wrap:balance}

/* book view */
.book{position:relative;padding-right:34px}
.tabs{position:absolute;right:0;top:16px;display:grid;gap:6px;z-index:3}
.tabs button{width:36px;padding:8px 0;border:1.2px solid var(--edge);border-left:0;border-radius:0 5px 5px 0;background:var(--n-blue);color:var(--paper-ink);font:800 10px var(--sans);cursor:pointer}
.tabs button:nth-child(3n+2){background:var(--n-butter)} .tabs button:nth-child(3n){background:var(--n-sage)}
.tabs button[aria-current=true]{transform:translateX(4px);box-shadow:2px 2px 0 var(--paper-ink)}
.book .page{padding:18px 16px 18px 26px;min-height:340px}
.book .page::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:8px;background:radial-gradient(circle at 4px 6px,transparent 3px,var(--paper-ink) 3.4px,transparent 4.4px) 0 0/8px 34px repeat-y}
.pg-h{font:400 24px/1.1 var(--serif);margin:0}
.pg-m{font-size:11px;color:var(--paper-soft);margin:2px 0 12px}
.sec{margin:12px 0 6px;font:800 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-soft)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.it{background:var(--n-cream);border:1.1px solid var(--edge);padding:6px 9px;font:400 13.5px/1.25 var(--serif);color:var(--paper-ink);cursor:pointer;text-align:left;max-width:100%}
.it.q{background:var(--n-butter)} .it.tk{background:var(--n-blue);border-radius:14px}
.it .obs{display:block;font:400 12px/1.35 var(--sans);color:var(--paper-soft);margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--sans);padding:4px 10px;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--paper-ink);align-self:flex-start}
.evo{display:grid;gap:12px}
.evo .q{font:400 16px/1.25 var(--serif)}
.evo s{color:var(--paper-soft);font-size:13px;display:block}
.evo ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--paper-soft)}
.evo li b{color:var(--paper-ink)}
.book.closing .page{animation:closeBook .7s ease forwards}
@keyframes closeBook{to{transform:perspective(900px) rotateY(-70deg);opacity:0}}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(40,32,28,.32);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.sheet-bg.in{opacity:1}
.sheet{width:100%;max-width:440px;background:var(--cream-bg);color:var(--ink);border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(30px);transition:transform .35s var(--spring);max-height:88vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet-bg.in .sheet{transform:none}
.sheet h3{font:400 22px/1.15 var(--serif);margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:13px;color:var(--ink-soft)}
.sheet textarea{min-height:110px;resize:vertical}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tog small{display:block;color:var(--ink-soft);font-size:11.5px}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:transform .3s var(--spring);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--coral)}
.sw:checked::after{transform:translateX(18px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.2px solid var(--line);background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:7px 12px;font:700 12px var(--sans);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--n-butter);border-color:var(--paper-ink)}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:1.3px solid var(--edge);cursor:pointer}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--cream-bg),0 0 0 5px var(--coral)}
.arch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));z-index:60;pointer-events:none;transform:translate(-50%,-20px) rotate(-1deg);opacity:0;background:var(--paper);color:var(--paper-ink);border:1.2px solid var(--edge);padding:9px 14px;font:400 14px/1.3 var(--serif);box-shadow:0 8px 16px -8px var(--shadow);transition:transform .45s var(--spring),opacity .3s;max-width:calc(100% - 32px)}
.toast.in{transform:translate(-50%,0) rotate(-1deg);opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* first read + filters */
.readpaper{cursor:default}
.readpaper .panel{max-height:190px;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.stamp-mark{position:absolute;right:7%;top:42%;border:3px double var(--sc);color:var(--sc);font:800 17px/1 var(--sans);letter-spacing:.14em;padding:9px 12px;transform:rotate(-12deg);background:rgba(255,252,245,.7);animation:stampIn .55s var(--spring) .25s both}
@keyframes stampIn{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.suff{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.suff span{color:var(--paper-soft);font-size:12px;text-align:right}
.suff.thin b{color:#B4462F}
.checks{display:grid;gap:6px}
.ck{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.ck i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--sans);border:1.2px solid var(--edge)}
.ck.ok i{background:var(--n-sage)} .ck.no i{background:var(--n-pink)} .ck.un i{background:var(--n-butter)}
.ck span{color:var(--paper-soft);font-size:11.5px;display:block}
.ck em{font:800 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);font-style:normal}
.pref{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.pref-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pref-h b{font:400 17px var(--serif)}
.imp{flex-wrap:nowrap}
.imp button{padding:4px 9px;font-size:11px}
.pref input,.pref select{font:400 15px var(--sans);border:1.2px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);color:var(--paper-ink);width:100%;min-width:0}
.pref.off > :not(.pref-h){opacity:.55}
button.status{cursor:pointer}
/* onboarding + preferences */
.dots{display:flex;gap:6px;margin-top:6px}
.dots .d{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.dots .d.done{background:var(--ink-soft)} .dots .d.on{background:var(--coral)}
.onb-art{position:relative;height:150px;margin-top:20px}

.onb-art span:last-child{left:calc(50% - 20px);background:var(--n-sage);mix-blend-mode:multiply;animation-delay:-3s}
textarea.ans{font:400 18px/1.4 var(--serif);min-height:190px;border:1.2px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);color:var(--paper-ink);width:100%;resize:vertical}
.plist{display:grid;gap:6px}
.plist{display:grid;gap:12px}
.prow{position:relative;transform:rotate(var(--r,0deg))}
.prow .note-w{position:relative;margin-right:14px}
.ptxt.note{display:block;width:100%;text-align:left;cursor:pointer;font:400 16.5px/1.22 var(--serif);padding:12px 26px 13px 13px}
.ptxt.note small{margin-top:6px}
.prow .x{position:absolute;right:0;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;border:1.2px solid var(--edge);background:var(--n-cream);color:var(--paper-ink);font:400 16px/1 var(--sans);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 3px var(--shadow);z-index:2}
.scrap .plist .prow:nth-child(3n+1) .note-w::before{content:"";position:absolute;left:38%;top:-7px;width:46px;height:14px;background:rgba(243,226,166,.9);transform:rotate(-4deg);z-index:2}
.pcard{position:relative;background:var(--paper);color:var(--paper-ink);border:1.3px solid var(--edge);padding:16px 12px 12px;display:grid;gap:10px;box-shadow:3px 4px 0 -1px var(--n-sage),3px 4px 0 0 var(--edge)}
.pcard::before{content:"";position:absolute;left:42%;top:-7px;width:50px;height:14px;background:rgba(243,226,166,.9);transform:rotate(-3deg)}
.pcard:nth-child(odd){transform:rotate(-.6deg)} .pcard:nth-child(even){transform:rotate(.6deg)}
.pcard p{margin:0;font:400 17px/1.25 var(--serif)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cats button{border:1.2px solid var(--line);background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:9px 6px;font:700 12px var(--sans);cursor:pointer;transition:background .2s,transform .25s var(--spring)}
.cats button[aria-pressed=true]{border-color:var(--paper-ink);transform:scale(1.03)}
.cats button[data-c=need][aria-pressed=true]{background:var(--n-blue)}
.cats button[data-c=nice][aria-pressed=true]{background:var(--n-sage)}
.cats button[data-c=avoid][aria-pressed=true]{background:var(--n-butter)}
.cats button[data-c=no][aria-pressed=true]{background:var(--n-pink)}
.srcq{font-size:12.5px;line-height:1.4}
.srcq b{display:block;font:800 9px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.checkin{background:var(--n-butter);color:var(--paper-ink);border:1.2px solid var(--edge);border-radius:8px;padding:12px;display:grid;gap:8px}
.checkin .q{font:400 17px/1.25 var(--serif);margin:0}
.checkin .pick{margin:0;font-size:12.5px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row3 .btn{padding:10px 6px;font-size:12px}
.row-pills{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rs{display:grid;gap:8px}
.rs h2{font:400 21px/1.15 var(--serif);margin:6px 0 0}
.ri{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.ri.dim{opacity:.55}
.ri-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font:400 16px/1.25 var(--serif)}
.ri q{display:block;font:400 12.5px/1.4 var(--sans);color:var(--paper-soft);border-left:2px solid var(--line);padding-left:8px;quotes:none}
.ri-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--paper-soft)}
.ri-f button{background:none;border:1px solid var(--line);border-radius:14px;padding:5px 10px;font:700 11.5px var(--sans);color:var(--paper-ink);cursor:pointer;flex:none}
.ri-f button:disabled{opacity:.5;cursor:default}
.ev{flex:none;font:800 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:10px;border:1px solid var(--edge);margin-top:2px}
.ev.aligned{background:var(--n-sage)} .ev.conflict{background:var(--n-pink)} .ev.unknown{background:var(--n-butter)} .ev.related{background:var(--n-blue)}
.rs-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ri-f .btns{display:flex;gap:6px}
.pic-obj{display:block;width:100%;height:100%;background:#FFFCF5;border:1.5px solid var(--edge);padding:5% 5% 16%;box-sizing:border-box}
.pic-obj img{display:block;width:100%;height:100%;object-fit:cover}
.imgpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgpick img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.bd-photo{float:right;width:70px;height:88px;object-fit:cover;border:3px solid #fff;outline:1px solid rgba(61,52,49,.3);transform:rotate(3deg);margin:2px 0 6px 10px;box-shadow:0 3px 6px rgba(0,0,0,.15)}
.who{display:flex;align-items:flex-end;gap:12px}
.who img{width:58px;height:58px;object-fit:cover;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.bio-img{max-width:100%;max-height:50vh;object-fit:contain;border-radius:6px;justify-self:center}
.flagmark{align-self:flex-start;display:inline-block;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp-ok);border:2.5px double var(--stamp-ok);background:transparent;padding:7px 10px;transform:rotate(-4deg);border-radius:3px;animation:stampIn .5s var(--spring) both}
.flagmark.flag{color:var(--stamp-flag);border-color:var(--stamp-flag)}
button.flagmark{cursor:pointer}

  const out = [], sens = sentences(text), rank = {green: 0, yellow: 1, red: 2};

    const l = lean(pref, sen); if (!l) return;

    const key = pref.theme || pref.id, prev = out.find(x => x.key === key);
    if (prev) { if (rank[level] > rank[prev.level]) Object.assign(prev, {level, prefId: pref.id, text: flagLabel(pref, level), src: sen}); return; }
    out.push({id: uid(), key, level, prefId: pref.id, text: flagLabel(pref, level), src: sen, cleared: false});

// Prompts for a check-in: what the profile couldn't answer first, then whatever has been asked least.
function pickPrompts(f) {
  const order = {need: 0, no: 1, nice: 2, avoid: 3}, asked = {}, seen = new Set();
  f.entries.forEach(e => (e.answers || []).forEach(a => { asked[a.prefId] = (asked[a.prefId] || 0) + 1; }));
  const unknown = new Set((f.entries.find(e => e.type === 'match') || {unknown: []}).unknown);
  return mine().filter(x => x.cat && reflectFor(x))
    .sort((a, b) => (unknown.has(b.id) - unknown.has(a.id)) || ((asked[a.id] || 0) - (asked[b.id] || 0)) || (order[a.cat] - order[b.cat]))

// Spark comes from how you felt; Fit from the flags so far.
function summary(f) {
  const n = {green: 0, yellow: 0, red: 0};
  f.entries.forEach(e => (e.flags || []).forEach(x => { if (!x.cleared) n[x.level]++; }));
  const feels = f.entries.filter(e => e.feel).slice(-3).map(e => e.feel);
  const chemLv = feels.length ? Math.round(feels.reduce((a, b) => a + b, 0) / feels.length) : 0;
  const tot = n.green + n.yellow + n.red;
  const compLv = tot ? clamp(Math.round((n.green + .5) / (n.green + n.yellow + 2 * n.red + 1) * 5), 1, 5) : 0;
  let line;
  if (!chemLv && !compLv) line = f.profile ? 'Write a journal entry after you talk to see where the seesaw lands.' : 'Add their profile to start.';
  else if (!chemLv) line = 'Tap how you felt in a journal entry to see the spark.';
  else if (!compLv) line = 'Write about what happened to see the fit.';
  else if (chemLv - compLv >= 2) line = 'All spark so far. The fit is still catching up.';
  else if (compLv - chemLv >= 2) line = 'Fits on paper. The spark is still warming up.';
  else if (chemLv >= 4 && compLv >= 4) line = 'Spark and fit, nicely balanced.';
  else if (chemLv <= 2 && compLv <= 2) line = 'Not much pulling either way yet.';
  else line = 'Spark and fit are moving together.';
  return {n, chemLv, compLv, chemW: ['Not yet', 'Fizzled', 'Faint', 'Flickering', 'Glowing', 'Sparks flying'][chemLv], compW: ['Not yet', 'Shaky', 'Patchy', 'Patchy', 'Good fit', 'Great fit'][compLv], line};
}
const tally = n => `<span class="tally">${['green', 'yellow', 'red'].map(l => `<span title="${l} flags">${flagSvg(l)}${n[l]}</span>`).join('')}</span>`;
// Spark and Fit sit on a seesaw: each grows and cheers up as it rises, and the heavier side tips down.
function seesaw(s) {
  const tilt = (s.compLv - s.chemLv) * 4.5;
  const buddy = (lv, x, fill) => {
    if (!lv) return `<g transform="translate(${x - 17} 58)"><path d="${BLOBS[0]}" transform="scale(.58)" fill="none" stroke="#3D3431" stroke-width="2.6" stroke-dasharray="4 4"/><text x="17" y="22" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="15" fill="#7A6D66">?</text></g>`;
    const sc = .5 + lv * .09, face = TOKENS[FEEL[lv - 1][2]].face;
    return `<g class="bud" style="--d:${x > 150 ? .15 : 0}s"><g transform="translate(${x - 30 * sc} ${91 - 55 * sc}) scale(${sc})"><path d="${BLOBS[lv % 3]}" fill="${fill}" stroke="#3D3431" stroke-width="${2.2 / sc}" stroke-linejoin="round"/><g transform="translate(0 -2)">${face}</g></g></g>`;
  };
  return `<svg class="seesaw" viewBox="0 0 300 132" role="img" aria-label="Spark ${s.chemW}, Fit ${s.compW}">
    <path d="M10 126h280" stroke="#3D3431" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <g class="plank" style="--tilt:${tilt}deg">${buddy(s.chemLv, 62, '#EDC3BC')}${buddy(s.compLv, 238, '#C3D3B8')}
      <rect x="22" y="91" width="256" height="9" rx="4.5" fill="#D8B387" stroke="#3D3431" stroke-width="2"/></g>
    <path d="M150 96l-17 30h34z" fill="#F3E2A6" stroke="#3D3431" stroke-width="2" stroke-linejoin="round"/><circle cx="150" cy="99" r="3" fill="#3D3431"/>
  </svg>`;
}
const fchip = (e, x) => `<button class="fchip ${x.level}${x.cleared ? ' cleared' : ''}" data-flag="${e.id}:${x.id}">${flagSvg(x.level)}<span>${esc(x.text)}</span></button>`;

// Older saves (scrapbooks with meetings) become folders with a timeline.
(function migrate() {
  const books = (S.books || []).map(b => b.meetings ? b : {id: b.id, name: b.name, created: b.created, example: b.example, profile: null, status: b.status,
    meetings: (b.pages || []).map(pg => ({id: pg.id, date: pg.date, kind: pg.kind || '', note: [...(pg.fragments || []).filter(x => x.text).map(x => x.text), ...(pg.notes || []).map(x => x.text)].join('\n')}))});
  (S.archived || []).forEach(a => { if (a.draft && a.draft.profile) books.push({id: uid(), name: a.draft.profile.name || 'Someone', profile: a.draft.profile, status: 'passed', meetings: []}); });

    <div class="actions"><button class="btn primary" id="save">Add to timeline</button></div>`,
    mount: r => {
      on(r, '[data-feel]', (e, x) => { ci.feel = ci.feel === +x.dataset.feel ? 0 : +x.dataset.feel; $$('[data-feel]', r).forEach(y => { y.setAttribute('aria-pressed', +y.dataset.feel === ci.feel); y.classList.remove('pop'); }); if (ci.feel) { void x.offsetWidth; x.classList.add('pop'); } sfx('tuck'); buzz(6); });
      on(r, '#kind button', (e, x) => { ci.kind = ci.kind === x.dataset.k ? '' : x.dataset.k; $$('#kind button', r).forEach(y => y.setAttribute('aria-pressed', y.dataset.k === ci.kind)); sfx('tuck'); });
      on(r, '#help', () => { ci.help = !ci.help; sfx('page'); render(); });
      // tapping a starter prompt drops it into the page as a line to continue from
      on(r, '[data-q]', (e, x) => { const q = nudges[+x.dataset.q], ta = $('#jt', r); ci.text = (ci.text.trim() ? ci.text.trimEnd() + '\n' : '') + q + ' '; ta.value = ci.text; ta.focus(); ta.setSelectionRange(ci.text.length, ci.text.length); ci.help = false; x.closest('.helper-list').remove(); $('#help', r).setAttribute('aria-expanded', 'false'); sfx('tuck'); });
      on(r, '#setp', toPrefs);
      let tm = null, last = '';
      $('#jt', r).addEventListener('input', e => {
        ci.text = e.target.value; clearTimeout(tm);
        tm = setTimeout(() => { const box = $('#tags', r), html = tagsHtml(ci.text); if (html !== last) { last = html; box.innerHTML = html; $$('.fchip', box).forEach(c => c.classList.add('pop-in')); } }, 350);
      });
      on(r, '#save', () => {
        if (!ci.feel && !ci.kind && !ci.text.trim()) { back(); return; }
        const e = {id: uid(), type: 'journal', date: Date.now(), feel: ci.feel || null, kind: ci.kind, note: ci.text.trim(), flags: autoTag(ci.text)};
        f.entries.push(e); S.ui.fresh = e.id; save(); toast(e.flags.length ? `Added · ${e.flags.length} tag${e.flags.length > 1 ? 's' : ''}` : 'Added'); back();
      });
    }
  };
};

/* ---------- example folder for a first look ---------- */
function exampleFolder() {
  const day = 864e5, p = parseBiodata(SAMPLE);
  const f = {id: uid(), name: 'Rohan', example: true, created: Date.now() - 20 * day, status: 'exploring', profile: p, entries: [matchEntry(p, Date.now() - 20 * day)]};
  const mk = (ago, feel, kind, text) => f.entries.push({id: uid(), type: 'journal', date: Date.now() - ago * day, feel, kind, note: text, flags: autoTag(text)});
  mk(14, 4, 'Call', 'We talked about books for ages and he was really curious about what I read. He laughed a lot, easy to talk to.');
  mk(8, 3, 'Coffee', 'He checked his phone a lot. When I disagreed about something he went quiet and changed the subject. Funny story about a football trophy though.');
  mk(3, 5, 'Date', 'Easy and warm. He asked what I needed and respected that I wanted to head home early. He said we would make our own decisions, not his parents.');
  return f;
}

/* ---------- settings + privacy ---------- */
function openSettings() {
  const st = S.settings;
  const pals = [['butter', 'Butter', ['#F7EDCB', '#EDC3BC', '#C65A43']], ['lagoon', 'Lagoon', ['#E2EEEF', '#BCD8E6', '#2C7C84']], ['plum', 'Plum', ['#F3E5EE', '#F6D88A', '#7D3F7B']]];
  sheet(`<h3>Settings</h3>
  <p class="label">Mode</p><div class="seg" id="s-mode">${[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button data-mode="${k}" aria-pressed="${(st.mode || 'system') === k}">${l}</button>`).join('')}</div>
  <p class="label">Palette</p><div class="pals" id="s-pal">${pals.map(([k, l, cs]) => `<button data-pal="${k}" aria-pressed="${(st.pal || 'butter') === k}"><span class="sw3">${cs.map(c => `<i style="background:${c}"></i>`).join('')}</span>${l}</button>`).join('')}</div>
  <label class="tog"><span>Reduced motion</span><input type="checkbox" class="sw" id="s-rm" ${st.reduced ? 'checked' : ''}></label>
  <label class="tog"><span>Paper sounds</span><input type="checkbox" class="sw" id="s-snd" ${st.sound ? 'checked' : ''}></label>
  <label class="tog"><span>Haptics</span><input type="checkbox" class="sw" id="s-hap" ${st.haptics ? 'checked' : ''}></label>
  <p>Saved only in this browser. Contact details are never kept.</p>
  <button class="btn" id="s-f">My preferences</button>
  <div class="row2"><button class="btn" id="s-all">Delete everything</button><button class="btn primary" data-x>Done</button></div>`, (sh, close) => {
    on(sh, '#s-mode button', (e, x) => { st.mode = x.dataset.mode; applyLook(); save(); $$('#s-mode button', sh).forEach(y => y.setAttribute('aria-pressed', y === x)); sfx('tuck'); });
    on(sh, '#s-pal button', (e, x) => { st.pal = x.dataset.pal; applyLook(); save(); $$('#s-pal button', sh).forEach(y => y.setAttribute('aria-pressed', y === x)); sfx('tuck'); });
    $('#s-rm', sh).onchange = e => { st.reduced = e.target.checked; applyMotion(); save(); };
    $('#s-snd', sh).onchange = e => { st.sound = e.target.checked; save(); if (st.sound) sfx('page'); };
    $('#s-hap', sh).onchange = e => { st.haptics = e.target.checked; save(); buzz(10); };
    $('[data-x]', sh).onclick = close;
    $('#s-f', sh).onclick = () => { close(); toPrefs(); };
    $('#s-all', sh).onclick = () => { close(); confirmSheet('Delete everything?', 'This can’t be undone.', 'Delete', () => { const keep = S.settings; S = fresh(); S.settings = keep; try { localStorage.removeItem(KEY); } catch (e) {} save(); toast('Deleted'); go('home', {}, 'reset'); }); };
  });
}

cur = {name: 'home', opts: {}};
render();
})();
</script>
